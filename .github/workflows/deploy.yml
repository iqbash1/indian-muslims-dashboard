name: deploy

# Ships the committed dashboard (docs/) to Cloudflare (muslimdata.in) on every
# push to main.
#
# Replaces Cloudflare's "Connect to Git" auto-build, which failed at checkout:
# Cloudflare's clone smudges Git LFS, and this repo LFS-tracks ~400 MB of
# sources/** that the site never serves -> it blew through GitHub's LFS
# bandwidth quota and `git checkout` failed intermittently, freezing the site.
#
# We check out with lfs:false (sources/** is not needed to serve the site) and
# deploy the COMMITTED docs/ as-is with wrangler. docs/ is built + committed
# locally (see docs/runbooks/deploy-setup.md), so the deploy runs NO Python and
# NO build step: minimal failure surface, and the live "Last updated" date
# matches exactly what was committed (no CI rebuild re-stamping it to the
# runner's UTC date).
#
# ONE-TIME SETUP:
#   1. Cloudflare -> My Profile -> API Tokens -> Create Token ->
#      "Edit Cloudflare Workers" template -> scope it to this account.
#   2. GitHub repo -> Settings -> Secrets and variables -> Actions -> add:
#        CLOUDFLARE_API_TOKEN  = <the token from step 1>
#        CLOUDFLARE_ACCOUNT_ID = a76787eef6b59b0abe8511b17e042bfb
#   3. Cloudflare -> Workers & Pages -> indian-muslims-dashboard -> Settings ->
#      Build: disconnect/disable the git auto-build so deploys come only from
#      here (avoids the failing build + double deploys).
# Until CLOUDFLARE_API_TOKEN exists this workflow runs GREEN but skips the deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Gate on deploy secret
        id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN not set yet — skipping deploy. Add the secret to enable."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out (no LFS — sources/** not needed to serve the site)
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Deploy committed docs/ to Cloudflare Workers
        if: steps.gate.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pin wrangler 4.x: this is an assets-only Worker (wrangler.jsonc has
          # `assets` but no `main`), which needs Wrangler >=4 (Workers Static
          # Assets) or it errors "Missing entry-point". wrangler-action@v4 now
          # defaults to Wrangler v4, but we keep an exact pin for reproducible
          # deploys.
          wranglerVersion: '4.91.0'
          command: deploy
