name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # LFS files aren't needed for validation (validate.py only reads
          # text manifests + canonical CSVs, both regular git).
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        # requirements.txt is the minimal deploy set (PyYAML only); validate.py
        # also needs jsonschema, so install the dev set here.
        run: pip install -r requirements-dev.txt

      - name: Validate manifests + canonical CSVs against JSON schemas
        run: python validate/validate.py

      - name: Audit doc/data consistency (metric-count gate; year-span advisory)
        # Blocks only on hardcoded-count drift (e.g. README "21 metrics" vs the
        # actual carded count); year-span mismatches print as an advisory list.
        run: python validate/audit_consistency.py

      - name: Audit data accuracy (value ranges, provenance SHA, column-swap tripwire)
        # The value/provenance layer the schema gate can't see: range-by-unit,
        # CI ordering, duplicate keys, source SHA256 vs archive, and the
        # extraction_run stamp-shape check that catches column transposition.
        # LFS content isn't pulled here (lfs:false), so SHA checks degrade to
        # skipped for LFS files; the value/structure checks still run in full.
        run: python validate/audit_accuracy.py

      - name: Check source refresh cadence
        run: python validate/check_refresh.py
        # This step is informational only; non-zero exit doesn't fail the workflow.
        continue-on-error: true
