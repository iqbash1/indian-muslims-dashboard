<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="muslimdata.in data mark">
  <!-- A horizontal bar chart: the Muslim series in maroon, comparison
       communities in grey, mirroring the dashboard's signature card chart
       and the colour contract (maroon = Muslim data only). -->
  <style>
    .m { fill: #7b1d22; }   /* Muslim series */
    .o { fill: #b9b3a7; }   /* other communities */
    @media (prefers-color-scheme: dark) {
      .m { fill: #d98a8f; }
      .o { fill: #7d786f; }
    }
  </style>
  <rect class="m" x="9" y="6"  width="46" height="10" rx="3"/>
  <rect class="o" x="9" y="20" width="28" height="10" rx="3"/>
  <rect class="o" x="9" y="34" width="40" height="10" rx="3"/>
  <rect class="o" x="9" y="48" width="22" height="10" rx="3"/>
</svg>
