schema_version: 1

# Every metric on the dashboard must be defined here.
# Schema: manifest/schema/metric-entry.json

clusters:
  - id: demographics
    name: Demographics & geographic concentration
  - id: education
    name: Education
  - id: employment
    name: Employment & livelihoods
  - id: income
    name: Income, consumption, poverty
  - id: health
    name: Health & child wellbeing
  - id: housing
    name: Housing & basic amenities
  - id: finance
    name: Financial inclusion
  - id: representation
    name: Political representation
  - id: justice
    name: Justice & safety
  - id: civic
    name: Civic & public-sector access

metrics:

  # ----- Demographics (Phase 1) -----
  - id: pop-share
    name: Muslim share of total population
    cluster: demographics
    unit: percent
    higher_is_better: null
    definition: |
      Muslim population as a share of total population at the given
      geography level.
    sources: {primary: census-india-2011}
    geography_levels: [national, state, district]
    religions: [muslim]
    comparison_baselines: []
    phase: 1
    status: defined
    display:
      scorecard:
        label: "Population share"
        reference: null
        unit_format: percent
        higher_is_better: null
        order: 10

  - id: urban-share
    name: Urban share of population
    cluster: demographics
    unit: percent
    higher_is_better: null
    definition: |
      Percentage of each community living in urban areas. Census 2011 Table C-01
      provides religion × residence (rural/urban) × sex breakdowns at national,
      state, district, and town levels.
    sources: {primary: census-india-2011}
    geography_levels: [national, state]
    religions: [muslim, hindu, christian, sikh, buddhist, jain, other, all]
    methodology_notes: |
      Urban share = urban_persons / total_persons * 100, per Census 2011 C-01.
      Single-year metric (no time series — 2021 Census delayed). Muslims (~40%)
      and Christians (~40%) are markedly more urbanised than the all-India
      average (~31%) — a Sachar-era fact that conditions outcomes downstream
      (urban-poor labour markets, segregation, housing access).
    comparison_baselines: [hindu, all]
    phase: 1
    status: defined
    display:
      scorecard:
        label: "Urban share of population"
        reference: "hindu"
        unit_format: percent
        higher_is_better: null
        order: 15

  - id: sex-ratio
    name: Sex ratio (females per 1000 males)
    cluster: demographics
    unit: females_per_1000_males
    higher_is_better: null
    sources: {primary: census-india-2011}
    geography_levels: [national, state, district]
    religions: [muslim, hindu, sc, st, all]
    comparison_baselines: [hindu, all]
    phase: 1
    status: defined
    display:
      scorecard:
        label: "Sex ratio (F/1000M)"
        reference: "hindu"
        unit_format: females_per_1000_males
        higher_is_better: true
        order: 20

  - id: district-concentration-top100
    name: Share of Muslim population in top-100 concentration districts
    cluster: demographics
    unit: percent
    higher_is_better: null
    definition: |
      Share of national Muslim population that lives in the top 100 districts
      ranked by absolute Muslim population. High values = geographically
      concentrated; low values = dispersed.
    sources: {primary: census-india-2011}
    geography_levels: [national]
    religions: [muslim]
    methodology_notes: |
      Computed by sorting all ~640 Indian districts by absolute Muslim
      population (per Census 2011 state MDDS C-1 files), taking the top 100,
      summing their Muslim residents, and dividing by national Muslim total.
      Denominator field on canonical row records exact numerator (top-100 sum)
      and denominator (national Muslim count).
    comparison_baselines: []
    phase: 1
    status: defined
    display:
      scorecard:
        label: "Top-100 district concentration"
        reference: null
        unit_format: percent
        higher_is_better: null
        order: 30

  # ----- Education (Phase 1) -----
  - id: lit-7plus
    name: Literacy rate (7+ years)
    cluster: education
    unit: percent
    higher_is_better: true
    definition: |
      Share of population aged 7 and above who can both read and write
      with understanding in any language.
    sources:
      primary: census-india-2011
      cross_check: [plfs]
    geography_levels: [national, state, district]
    religions: [muslim, hindu, sc, st, all]
    methodology_notes: |
      Census defines literacy as ability to read and write with understanding
      in any language. PLFS uses a similar but not identical definition;
      document divergence on tile.
    break_notes: |
      Census vs PLFS series use slightly different definitions; do not connect
      them on the same line chart.
    comparison_baselines: [hindu, sc, all]
    phase: 1
    status: defined
    display:
      scorecard:
        label: "Literacy rate (7+)"
        reference: "hindu"
        unit_format: percent
        higher_is_better: true
        order: 40

  - id: mean-yrs-schooling
    name: Mean years of schooling (25+)
    cluster: education
    unit: years
    higher_is_better: true
    sources: {primary: nfhs-5}
    geography_levels: [national, state]
    religions: [muslim, hindu, sc, st, all]
    comparison_baselines: [hindu, sc, all]
    phase: 1
    status: stub

  - id: ger-higher-ed
    name: Gross Enrolment Ratio in higher education (18-23)
    cluster: education
    unit: percent
    higher_is_better: true
    definition: |
      Gross Enrolment Ratio = student enrolment in higher education / population
      in the 18-23 age cohort * 100. The AISHE-published headline GER.
    sources:
      primary: aishe
      cross_check: [census-india-2011]
    geography_levels: [national]
    religions: [muslim, all]
    methodology_notes: |
      Numerator: AISHE 2021-22 (Muslim 21,08,033; total 4,32,68,181 per Report
      p29 prose). Denominator: Census 2011 C-15 (15-19 + 20-24) × 0.6 as an
      18-23 effective-cohort proxy — single-year-age table (C-13) not pulled
      and 2021 Census deferred. This understates the 2021-22 cohort
      (especially for Muslims, whose age structure is more youth-skewed), so
      our computed GER sits ~2pp ABOVE published National (28.4%) and ~2pp
      BELOW published Muslim (~12%). The cross-religion gap (Muslim at
      roughly one-third the national rate) is robust to denominator choice
      and is the dashboard story.
    comparison_baselines: [all]
    phase: 1
    status: defined
    display:
      scorecard:
        label: "Higher-ed GER (18-23)"
        reference: "all"
        unit_format: percent
        higher_is_better: true
        order: 55

  - id: muslim-higher-ed-enrolment
    name: Muslim student enrolment in higher education (absolute count)
    cluster: education
    unit: count
    higher_is_better: null
    definition: |
      Total number of students classified as "Muslim Minority" enrolled in
      higher education institutions, per AISHE annual reporting.
    sources: {primary: aishe}
    geography_levels: [national, state]
    religions: [muslim]
    methodology_notes: |
      AISHE classifies enrolment as "Muslim Minority" vs "Other Minority
      Community" (Christians, Sikhs, Buddhists, Jains, Parsis), with Hindu
      enrolment implied as residual. This metric publishes only the
      absolute Muslim enrolment. Muslim *share* of total enrolment is a
      separate metric that requires Total Enrolment by state (separate
      AISHE table not yet extracted).
    comparison_baselines: []
    phase: 1
    status: defined
    display:
      scorecard:
        label: "Higher-ed enrolment (count)"
        reference: null
        unit_format: count
        higher_is_better: null
        order: 50

  # ----- Employment (Phase 1) -----
  - id: lfpr-15plus
    name: Labour Force Participation Rate (15+)
    cluster: employment
    unit: percent
    higher_is_better: true
    definition: |
      Share of population age 15+ who are in the labour force (either
      working or actively seeking work). Usual status (principal + subsidiary).
    sources: {primary: plfs}
    geography_levels: [national]
    religions: [muslim, hindu, all]
    methodology_notes: |
      PLFS 2023-24 Table 48 (pages 396-400). Total residence, person-level.
      Reference period: Jul 2023 - Jun 2024 (year=2023 in canonical row
      represents the start of this period).
    comparison_baselines: [hindu, all]
    phase: 1
    status: defined
    display:
      scorecard:
        label: "LFPR (15+)"
        reference: "hindu"
        unit_format: percent
        higher_is_better: true
        order: 60

  - id: wpr-15plus
    name: Worker Population Ratio (15+)
    cluster: employment
    unit: percent
    higher_is_better: true
    definition: |
      Share of population age 15+ who are currently working. Usual status
      (principal + subsidiary). WPR = LFPR - Unemployed.
    sources: {primary: plfs}
    geography_levels: [national]
    religions: [muslim, hindu, all]
    methodology_notes: |
      PLFS 2023-24 Table 48 (pages 396-400). Total residence, person-level.
    comparison_baselines: [hindu, all]
    phase: 1
    status: defined
    display:
      scorecard:
        label: "WPR (15+)"
        reference: "hindu"
        unit_format: percent
        higher_is_better: true
        order: 70

  - id: salaried-share
    name: Share of workers in regular salaried employment
    cluster: employment
    unit: percent
    higher_is_better: true
    definition: |
      Percentage of workers (usual status, ps+ss) employed in regular
      wage/salary positions (as opposed to self-employed or casual labour).
    sources: {primary: plfs}
    geography_levels: [national]
    religions: [muslim, hindu, all]
    methodology_notes: |
      PLFS 2023-24 Table 49 (pages 401-402). Rural+urban person-level.
      Muslims disproportionately self-employed (62.2% vs Hindu 58.3%) and
      under-represented in formal salaried work — the classic Sachar-era
      finding on labor-market segregation.
    comparison_baselines: [hindu, all]
    phase: 1
    status: defined
    display:
      scorecard:
        label: "Regular salaried share"
        reference: "hindu"
        unit_format: percent
        higher_is_better: true
        order: 75

  # ----- Income / consumption / poverty (Phase 1) -----
  - id: mpce
    name: Monthly Per Capita Consumption Expenditure
    cluster: income
    unit: inr_per_month
    higher_is_better: true
    sources: {primary: hces-2022-23}
    geography_levels: [national, state]
    religions: [muslim, hindu, sc, st, all]
    comparison_baselines: [hindu, all]
    phase: 1
    status: stub

  - id: mpi-headcount
    name: Multidimensional Poverty Index headcount ratio
    cluster: income
    unit: percent
    higher_is_better: false
    sources: {primary: niti-mpi}
    geography_levels: [national, state, district]
    religions: [muslim, hindu, sc, st, all]
    comparison_baselines: [hindu, all]
    phase: 1
    status: stub

  # ----- Health (Phase 1) -----
  - id: imr
    name: Infant Mortality Rate
    cluster: health
    unit: per_1000_live_births
    higher_is_better: false
    definition: |
      Probability of dying before the first birthday, expressed per 1000
      live births. Reference period: 5 years preceding NFHS-5 (2014-2020 approx).
    sources:
      primary: nfhs-5
      cross_check: [census-india-2011]
    geography_levels: [national]
    religions: [muslim, hindu, all]
    methodology_notes: |
      NFHS-5 Table 7.2 publishes URBAN and RURAL IMR by religion separately;
      no published total-residence-by-religion column. National total computed
      as population-weighted average using Census 2011 urban/rural population
      by religion as weights. Census 2011 weights vs NFHS 2019-21 data
      introduces <1% drift (urban/rural shares by religion are stable).
    comparison_baselines: [hindu, all]
    phase: 1
    status: defined
    display:
      scorecard:
        label: "Infant Mortality Rate"
        reference: "hindu"
        unit_format: per_1000_live_births
        higher_is_better: false
        order: 80

  - id: stunting-u5
    name: Stunting prevalence in children under 5
    cluster: health
    unit: percent
    higher_is_better: false
    definition: |
      Percentage of children under age 5 classified as stunted (height-for-age
      more than 2 SD below the WHO Child Growth Standards median). Stunting
      indicates chronic malnutrition in early life.
    sources: {primary: nfhs-5}
    geography_levels: [national]
    religions: [muslim, hindu, christian, sikh, buddhist, jain, all]
    methodology_notes: |
      NFHS-5 (2019-21) Table 10.1 (Nutritional status of children by background
      characteristics). Religion column = % below -2 SD HFA; all-India value
      is the sample-size-weighted average of the 6 religion rows (reproduces
      the published national rate of 35.5%). Single round in canonical for now;
      NFHS-2/3/4 extension possible (same pattern as IMR / inst-delivery / anaemia
      trend extractors).
    comparison_baselines: [hindu, all]
    phase: 1
    status: defined
    display:
      scorecard:
        label: "Children stunted (under 5)"
        reference: "hindu"
        unit_format: percent
        higher_is_better: false
        order: 65

  - id: inst-delivery
    name: Institutional delivery rate
    cluster: health
    unit: percent
    higher_is_better: true
    definition: |
      Percentage of live births in the 5 years preceding NFHS-5 that took
      place in a health facility (public or private), among women age 15-49.
    sources: {primary: nfhs-5}
    geography_levels: [national]
    religions: [muslim, hindu, all]
    methodology_notes: |
      NFHS-5 Table 8.13 (page 324). The "all" value is computed as a
      sample-size-weighted average of the 7 religion rates (published
      Total row was hard to extract cleanly from the dual-column PDF
      layout). Matches NFHS-5 published 88.6% within rounding.
    comparison_baselines: [hindu, all]
    phase: 1
    status: defined
    display:
      scorecard:
        label: "Institutional delivery rate"
        reference: "hindu"
        unit_format: percent
        higher_is_better: true
        order: 90

  - id: women-anemia
    name: Anemia in women aged 15-49
    cluster: health
    unit: percent
    higher_is_better: false
    definition: |
      Percentage of women age 15-49 with any anaemia, defined as haemoglobin
      <12.0 g/dl (non-pregnant) or <11.0 g/dl (pregnant), altitude-adjusted.
    sources: {primary: nfhs-5}
    geography_levels: [national]
    religions: [muslim, hindu, all]
    methodology_notes: |
      NFHS-5 Table 10.23.1 reports total-residence women's anaemia by religion
      directly. Year=2020 represents the midpoint of NFHS-5 fieldwork.
      Note: NFHS revised anaemia cut-offs between NFHS-4 (Hb <12.0 g/dl) and
      NFHS-5 (same cut-off, but capillary blood vs venous — affects comparability
      across rounds). Treat as methodology break for NFHS-4 -> NFHS-5 trends.
    comparison_baselines: [hindu, all]
    phase: 1
    status: defined
    display:
      scorecard:
        label: "Anaemia in women (15-49)"
        reference: "hindu"
        unit_format: percent
        higher_is_better: false
        order: 100

  # ----- Housing & amenities (Phase 1) -----
  - id: pucca-housing
    name: Pucca house share
    cluster: housing
    unit: percent
    higher_is_better: true
    sources:
      primary: nfhs-5
      cross_check: [census-india-2011]
    geography_levels: [national, state]
    religions: [muslim, hindu, sc, st, all]
    comparison_baselines: [hindu, all]
    phase: 1
    status: stub

  - id: improved-sanitation
    name: Toilet facility access (households)
    cluster: housing
    unit: percent
    higher_is_better: true
    definition: |
      Percentage of households with access to a toilet facility (any type).
      Note: not strictly "improved sanitation" per the JMP definition; the
      NFHS-5 published table aggregates flush, pit, and other toilet types.
    sources: {primary: nfhs-5}
    geography_levels: [national]
    religions: [muslim, hindu, all]
    methodology_notes: |
      NFHS-5 Table 2.4 (page 74). Total residence, national. Year=2020 =
      NFHS-5 fieldwork midpoint. Muslim toilet access (90.3%) runs *above*
      Hindu (80.7%) — partly because urban-Muslim share is higher than
      urban-Hindu share, and urban access is uniformly higher.
    comparison_baselines: [hindu, all]
    phase: 1
    status: defined
    display:
      scorecard:
        label: "Toilet facility access"
        reference: "hindu"
        unit_format: percent
        higher_is_better: true
        order: 110

  - id: clean-cooking-fuel
    name: Clean cooking fuel access
    cluster: housing
    unit: percent
    higher_is_better: true
    sources: {primary: nfhs-5}
    geography_levels: [national, state]
    religions: [muslim, hindu, sc, st, all]
    comparison_baselines: [hindu, all]
    phase: 1
    status: stub

  # ----- Financial inclusion (Phase 1) -----
  - id: bank-account
    name: Adult bank account ownership
    cluster: finance
    unit: percent
    higher_is_better: true
    sources: {primary: nfhs-5}
    geography_levels: [national, state]
    religions: [muslim, hindu, sc, st, all]
    comparison_baselines: [hindu, all]
    phase: 1
    status: stub

  # ----- Representation (Phase 2) -----
  - id: ls-share
    name: Muslim share of Lok Sabha members
    cluster: representation
    unit: percent
    higher_is_better: null
    definition: |
      Percentage of Lok Sabha members who are Muslim, by election cycle.
      Historical time series 2009-2024.
    sources: {primary: prs-eci-affidavits}
    geography_levels: [national]
    religions: [muslim]
    methodology_notes: |
      Religion is not tabulated by either ECI or PRS Legislative Research
      in their official candidate-profile publications. Underlying data is
      ECI candidate affidavits classified post-election by journalists
      and researchers. Figures cross-verified across multiple sources:
      Maktoob Media, FACTLY, The India Forum, Statista. Documented as
      "manual entry" canonical with citations in each row's methodology note.
      Time series: 2009=28/543 (5.16%), 2014=22/543 (4.05%), 2019=27/543
      (4.97%), 2024=24/543 (4.42%). Compare against Muslim population share
      of ~14.2% — chronic 9-10pp underrepresentation.
    comparison_baselines: []
    phase: 2
    status: defined
    display:
      scorecard:
        label: "Lok Sabha Muslim share (2024)"
        reference: null
        unit_format: percent
        higher_is_better: null
        order: 140
        special_render: time_series_latest

  - id: mla-share
    name: Muslim share of state legislative assembly members
    cluster: representation
    unit: percent
    higher_is_better: null
    definition: |
      Percentage of state legislative assembly seats held by Muslim MLAs.
      National aggregate (~6%) plus per-state values for 8 major states.
    sources: {primary: prs-eci-affidavits}
    geography_levels: [national, state]
    religions: [muslim]
    methodology_notes: |
      Manual-entry metric — like ls-share, religion is not officially
      tabulated by ECI or PRS. Underlying data is candidate-affidavit
      religion classified post-election by journalists (Maktoob, Clarion,
      India Forum, The Wire, Deccan Herald). National aggregate ~6%
      across 28 state assemblies; specific state values for: West Bengal
      2026 (13.65%), Kerala 2026 (25%), Maharashtra 2024 (3.47%),
      Haryana 2024 (5.56%), MP 2023 (0.87%), Rajasthan 2023 (3%),
      Telangana 2023 (5.88%), Chhattisgarh 2023 (0%). Coverage gap:
      19+ more state assemblies need their own research.
    comparison_baselines: []
    phase: 2
    status: defined
    display:
      scorecard:
        label: "State MLA Muslim share (national agg)"
        reference: null
        unit_format: percent
        higher_is_better: null
        order: 145
        special_render: time_series_latest

  # ----- Justice (Phase 2) -----
  - id: prison-share
    name: Muslim share of prison population
    cluster: justice
    unit: percent
    higher_is_better: null
    definition: |
      Muslim share of total prison population (convicts + undertrials +
      detenues + other prisoners), among prisoners whose religion was
      reported. Compare against Muslim share of total population (~14.2%).
    sources: {primary: ncrb-prison}
    geography_levels: [national]
    religions: [muslim, hindu]
    methodology_notes: |
      NCRB PSI Tables 2.10C-2.13C, years 2018-2023 (2016/2017/2020 not available
      from primary/archive sources; 2015 report has no religion-by-state table).
      Some states (e.g. Maharashtra) did not report religion for undertrials/
      detenues in several years, so each year's religion-reported denominator
      excludes them. Shares are computed over religion-reported prisoners only.
    comparison_baselines: []
    phase: 2
    status: defined
    display:
      scorecard:
        label: "Muslims in prison (% share)"
        reference: population
        unit_format: percent
        higher_is_better: false
        order: 120
        special_render: share_trend

  - id: prison-rate-per-100k
    name: Prison population rate (per 100k of religious population)
    cluster: justice
    unit: per_100k_population
    higher_is_better: false
    definition: |
      Incarceration rate: prisoners of religion R per 100,000 of religion R's
      total population. More direct measure of disproportion than "share of
      prisoners" — comparable across religions without needing to know
      population baselines.
    sources:
      primary: ncrb-prison
      cross_check: [census-india-2011]
    geography_levels: [national]
    religions: [muslim, hindu, all]
    methodology_notes: |
      Cross-source: NCRB PSI 2022 total prisoner count (convicts + undertrials
      + detenues + other prisoners; STATES + UTs subtotals = ALL-INDIA by
      construction) divided by Census 2011 national religious population times
      100,000. The 'denominator' column on each canonical row records the exact
      (count, population) pair used. Caveat: Maharashtra non-reporting of
      religion for ~33k undertrials/detenues — religion-reported numerator
      excludes those; full national population is the denominator.
    comparison_baselines: [hindu, all]
    phase: 2
    status: defined
    # Rate-per-100k retained as canonical data (2022 only — the rate needs a
    # Census-year population denominator, clean only to 2011). The carded justice
    # metric is now the multi-year prison-SHARE trend, so this is not rendered.

  - id: undertrial-rate-per-100k
    name: Undertrial population rate (per 100k of religious population)
    cluster: justice
    unit: per_100k_population
    higher_is_better: false
    definition: |
      Undertrial prisoners of religion R per 100,000 of religion R's total
      population. Sister metric to prison-rate-per-100k.
    sources:
      primary: ncrb-prison
      cross_check: [census-india-2011]
    geography_levels: [national]
    religions: [muslim, hindu, all]
    methodology_notes: |
      NCRB PSI 2022 Table 2.11C undertrial counts (STATES + UTs subtotals)
      divided by Census 2011 national religious population times 100,000.
      Same Maharashtra caveat as prison-rate-per-100k.
    comparison_baselines: [hindu, all]
    phase: 2
    status: defined
    # Rate-per-100k retained as canonical data (2022 only). The carded undertrial
    # metric is now the multi-year undertrial-SHARE trend, so this is not rendered.

  - id: undertrial-share
    name: Muslim share of undertrial prisoners
    cluster: justice
    unit: percent
    higher_is_better: null
    definition: |
      Muslim share of undertrial prisoner population — those awaiting trial,
      not yet convicted. Compare against Muslim share of total population
      (~14.2%) and Muslim share of convicts (~17.1%).
    sources: {primary: ncrb-prison}
    geography_levels: [national]
    religions: [muslim, hindu]
    methodology_notes: |
      NCRB PSI Table 2.11C, years 2018-2023 (2016/2017/2020 not available from
      primary/archive sources). Some states (e.g. Maharashtra) did not report
      religion for undertrials in several years; each year's share is computed
      over the religion-reported subset only.
    comparison_baselines: []
    phase: 2
    status: defined
    display:
      scorecard:
        label: "Muslims among undertrials (% share)"
        reference: population
        unit_format: percent
        higher_is_better: false
        order: 130
        special_render: share_trend

  # ----- Civic / safety (Phase 2) -----
  - id: communal-incidents-govt
    name: Communal incidents (government-acknowledged)
    cluster: civic
    unit: count
    higher_is_better: false
    definition: |
      Number of communal/religious rioting incidents recorded by NCRB under
      IPC Sec.147-151 (rioting), specifically the "Communal/Religious"
      sub-classification. National annual totals (2020-2022) plus state-level
      breakdown for 2022.
    sources: {primary: ncrb-crime}
    geography_levels: [national, state]
    religions: [all]
    methodology_notes: |
      NCRB Crime in India 2022, Table 1.2 (national, 2020-2022). Incident
      counts only — no religion of victim/perpetrator in the published table.
      Caveat: several states stopped recording 'communal' as a separate
      crime category since ~2017, which deflates the national total over
      time. Civil-society compilations (Documentation of the Oppressed,
      India Hate Lab) typically report higher counts.
    comparison_baselines: []
    phase: 2
    status: defined
    display:
      scorecard:
        label: "Communal incidents (NCRB 2022)"
        reference: null
        unit_format: count
        higher_is_better: null
        order: 150
        special_render: time_series_count

