  - id: communal-incidents-civic
    name: Anti-Muslim hate speech events
    cluster: civic
    unit: count
    higher_is_better: false
    definition: |
      Annual count of verified in-person anti-Muslim hate speech events
      documented by India Hate Lab (IHL). Includes political rallies,
      religious gatherings, and electoral events with hateful rhetoric.
    sources: {primary: civic-incident-databases}
    geography_levels: [national]
    religions: [all]
    methodology_notes: |
      Fundamentally different unit from NCRB's `communal-incidents-govt`:
      IHL counts hate speech events (rallies, political speeches with
      hateful rhetoric, ~98% targeting Muslims), while NCRB counts
      police-registered communal rioting incidents (IPC Sec.147-151).
      Both metrics share the dashboard's Civic cluster intentionally so
      readers see both views side-by-side.
      Time series: 2023 = 668 events, 2024 = 1,165 events (74% YoY rise).
    comparison_baselines: []
    phase: 2
    # Decarded 2026-06-07 at user's request ("data is a bit controversial");
