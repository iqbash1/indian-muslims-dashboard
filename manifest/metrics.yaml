schema_version: 1

# Every metric on the dashboard must be defined here.
# Schema: manifest/schema/metric-entry.json

clusters:
  - id: demographics
    name: Demographics & geographic concentration
  - id: education
    name: Education
  - id: employment
    name: Employment & livelihoods
  - id: income
    name: Income, consumption, poverty
  - id: health
    name: Health & child wellbeing
  - id: housing
    name: Housing & basic amenities
  - id: finance
    name: Financial inclusion
  - id: representation
    name: Political representation
  - id: justice
    name: Justice & safety
  - id: civic
    name: Civic & public-sector access

metrics:

  # ----- Demographics (Phase 1) -----
  - id: pop-share
    name: Muslim share of total population
    cluster: demographics
    unit: percent
    higher_is_better: null
    definition: |
      Muslim population as a share of total population at the given
      geography level.
    sources: {primary: census-india-2011}
    geography_levels: [national, state, district]
    religions: [muslim]
    comparison_baselines: []
    phase: 1
    status: defined

  - id: urban-share
    name: Urban share of population
    cluster: demographics
    unit: percent
    higher_is_better: null
    sources: {primary: census-india-2011}
    geography_levels: [national, state]
    religions: [muslim, hindu, all]
    comparison_baselines: [hindu, all]
    phase: 1
    status: stub

  - id: sex-ratio
    name: Sex ratio (females per 1000 males)
    cluster: demographics
    unit: females_per_1000_males
    higher_is_better: null
    sources: {primary: census-india-2011}
    geography_levels: [national, state, district]
    religions: [muslim, hindu, sc, st, all]
    comparison_baselines: [hindu, all]
    phase: 1
    status: stub

  - id: district-concentration-top100
    name: Share of Muslim population in top-100 concentration districts
    cluster: demographics
    unit: percent
    higher_is_better: null
    sources: {primary: census-india-2011}
    geography_levels: [national]
    religions: [muslim]
    comparison_baselines: []
    phase: 1
    status: stub

  # ----- Education (Phase 1) -----
  - id: lit-7plus
    name: Literacy rate (7+ years)
    cluster: education
    unit: percent
    higher_is_better: true
    definition: |
      Share of population aged 7 and above who can both read and write
      with understanding in any language.
    sources:
      primary: census-india-2011
      cross_check: [plfs]
    geography_levels: [national, state, district]
    religions: [muslim, hindu, sc, st, all]
    methodology_notes: |
      Census defines literacy as ability to read and write with understanding
      in any language. PLFS uses a similar but not identical definition;
      document divergence on tile.
    break_notes: |
      Census vs PLFS series use slightly different definitions; do not connect
      them on the same line chart.
    comparison_baselines: [hindu, sc, all]
    phase: 1
    status: defined

  - id: mean-yrs-schooling
    name: Mean years of schooling (25+)
    cluster: education
    unit: years
    higher_is_better: true
    sources: {primary: nfhs-5}
    geography_levels: [national, state]
    religions: [muslim, hindu, sc, st, all]
    comparison_baselines: [hindu, sc, all]
    phase: 1
    status: stub

  - id: ger-higher-ed
    name: Gross Enrollment Ratio in higher education (18-23)
    cluster: education
    unit: percent
    higher_is_better: true
    sources:
      primary: aishe
      cross_check: [plfs]
    geography_levels: [national, state]
    religions: [muslim, hindu, sc, st, all]
    comparison_baselines: [hindu, sc, all]
    phase: 1
    status: stub

  - id: muslim-higher-ed-enrolment
    name: Muslim student enrolment in higher education (absolute count)
    cluster: education
    unit: count
    higher_is_better: null
    definition: |
      Total number of students classified as "Muslim Minority" enrolled in
      higher education institutions, per AISHE annual reporting.
    sources: {primary: aishe}
    geography_levels: [national, state]
    religions: [muslim]
    methodology_notes: |
      AISHE classifies enrolment as "Muslim Minority" vs "Other Minority
      Community" (Christians, Sikhs, Buddhists, Jains, Parsis), with Hindu
      enrolment implied as residual. This metric publishes only the
      absolute Muslim enrolment. Muslim *share* of total enrolment is a
      separate metric that requires Total Enrolment by state (separate
      AISHE table not yet extracted).
    comparison_baselines: []
    phase: 1
    status: defined

  # ----- Employment (Phase 1) -----
  - id: lfpr-15plus
    name: Labour Force Participation Rate (15+)
    cluster: employment
    unit: percent
    higher_is_better: true
    definition: |
      Share of population age 15+ who are in the labour force (either
      working or actively seeking work). Usual status (principal + subsidiary).
    sources: {primary: plfs}
    geography_levels: [national]
    religions: [muslim, hindu, all]
    methodology_notes: |
      PLFS 2023-24 Table 48 (pages 396-400). Total residence, person-level.
      Reference period: Jul 2023 - Jun 2024 (year=2023 in canonical row
      represents the start of this period).
    comparison_baselines: [hindu, all]
    phase: 1
    status: defined

  - id: wpr-15plus
    name: Worker Population Ratio (15+)
    cluster: employment
    unit: percent
    higher_is_better: true
    definition: |
      Share of population age 15+ who are currently working. Usual status
      (principal + subsidiary). WPR = LFPR - Unemployed.
    sources: {primary: plfs}
    geography_levels: [national]
    religions: [muslim, hindu, all]
    methodology_notes: |
      PLFS 2023-24 Table 48 (pages 396-400). Total residence, person-level.
    comparison_baselines: [hindu, all]
    phase: 1
    status: defined

  - id: salaried-share
    name: Share of workers in regular salaried employment
    cluster: employment
    unit: percent
    higher_is_better: true
    sources: {primary: plfs}
    geography_levels: [national, state]
    religions: [muslim, hindu, sc, st, all]
    comparison_baselines: [hindu, all]
    phase: 1
    status: stub

  # ----- Income / consumption / poverty (Phase 1) -----
  - id: mpce
    name: Monthly Per Capita Consumption Expenditure
    cluster: income
    unit: inr_per_month
    higher_is_better: true
    sources: {primary: hces-2022-23}
    geography_levels: [national, state]
    religions: [muslim, hindu, sc, st, all]
    comparison_baselines: [hindu, all]
    phase: 1
    status: stub

  - id: mpi-headcount
    name: Multidimensional Poverty Index headcount ratio
    cluster: income
    unit: percent
    higher_is_better: false
    sources: {primary: niti-mpi}
    geography_levels: [national, state, district]
    religions: [muslim, hindu, sc, st, all]
    comparison_baselines: [hindu, all]
    phase: 1
    status: stub

  # ----- Health (Phase 1) -----
  - id: imr
    name: Infant Mortality Rate
    cluster: health
    unit: per_1000_live_births
    higher_is_better: false
    definition: |
      Probability of dying before the first birthday, expressed per 1000
      live births. Reference period: 5 years preceding NFHS-5 (2014-2020 approx).
    sources:
      primary: nfhs-5
      cross_check: [census-india-2011]
    geography_levels: [national]
    religions: [muslim, hindu, all]
    methodology_notes: |
      NFHS-5 Table 7.2 publishes URBAN and RURAL IMR by religion separately;
      no published total-residence-by-religion column. National total computed
      as population-weighted average using Census 2011 urban/rural population
      by religion as weights. Census 2011 weights vs NFHS 2019-21 data
      introduces <1% drift (urban/rural shares by religion are stable).
    comparison_baselines: [hindu, all]
    phase: 1
    status: defined

  - id: stunting-u5
    name: Stunting prevalence in children under 5
    cluster: health
    unit: percent
    higher_is_better: false
    sources: {primary: nfhs-5}
    geography_levels: [national, state]
    religions: [muslim, hindu, sc, st, all]
    comparison_baselines: [hindu, all]
    phase: 1
    status: stub

  - id: inst-delivery
    name: Institutional delivery rate
    cluster: health
    unit: percent
    higher_is_better: true
    definition: |
      Percentage of live births in the 5 years preceding NFHS-5 that took
      place in a health facility (public or private), among women age 15-49.
    sources: {primary: nfhs-5}
    geography_levels: [national]
    religions: [muslim, hindu, all]
    methodology_notes: |
      NFHS-5 Table 8.13 (page 324). The "all" value is computed as a
      sample-size-weighted average of the 7 religion rates (published
      Total row was hard to extract cleanly from the dual-column PDF
      layout). Matches NFHS-5 published 88.6% within rounding.
    comparison_baselines: [hindu, all]
    phase: 1
    status: defined

  - id: women-anemia
    name: Anemia in women aged 15-49
    cluster: health
    unit: percent
    higher_is_better: false
    definition: |
      Percentage of women age 15-49 with any anaemia, defined as haemoglobin
      <12.0 g/dl (non-pregnant) or <11.0 g/dl (pregnant), altitude-adjusted.
    sources: {primary: nfhs-5}
    geography_levels: [national]
    religions: [muslim, hindu, all]
    methodology_notes: |
      NFHS-5 Table 10.23.1 reports total-residence women's anaemia by religion
      directly. Year=2020 represents the midpoint of NFHS-5 fieldwork.
      Note: NFHS revised anaemia cut-offs between NFHS-4 (Hb <12.0 g/dl) and
      NFHS-5 (same cut-off, but capillary blood vs venous — affects comparability
      across rounds). Treat as methodology break for NFHS-4 -> NFHS-5 trends.
    comparison_baselines: [hindu, all]
    phase: 1
    status: defined

  # ----- Housing & amenities (Phase 1) -----
  - id: pucca-housing
    name: Pucca house share
    cluster: housing
    unit: percent
    higher_is_better: true
    sources:
      primary: nfhs-5
      cross_check: [census-india-2011]
    geography_levels: [national, state]
    religions: [muslim, hindu, sc, st, all]
    comparison_baselines: [hindu, all]
    phase: 1
    status: stub

  - id: improved-sanitation
    name: Improved sanitation access
    cluster: housing
    unit: percent
    higher_is_better: true
    sources: {primary: nfhs-5}
    geography_levels: [national, state]
    religions: [muslim, hindu, sc, st, all]
    comparison_baselines: [hindu, all]
    phase: 1
    status: stub

  - id: clean-cooking-fuel
    name: Clean cooking fuel access
    cluster: housing
    unit: percent
    higher_is_better: true
    sources: {primary: nfhs-5}
    geography_levels: [national, state]
    religions: [muslim, hindu, sc, st, all]
    comparison_baselines: [hindu, all]
    phase: 1
    status: stub

  # ----- Financial inclusion (Phase 1) -----
  - id: bank-account
    name: Adult bank account ownership
    cluster: finance
    unit: percent
    higher_is_better: true
    sources: {primary: nfhs-5}
    geography_levels: [national, state]
    religions: [muslim, hindu, sc, st, all]
    comparison_baselines: [hindu, all]
    phase: 1
    status: stub

  # ----- Representation (Phase 2) -----
  - id: ls-share
    name: Muslim share of Lok Sabha members
    cluster: representation
    unit: percent
    higher_is_better: null
    sources: {primary: prs-eci-affidavits}
    geography_levels: [national]
    religions: [muslim]
    comparison_baselines: []
    phase: 2
    status: stub

  - id: mla-share
    name: Muslim share of state legislative assembly members
    cluster: representation
    unit: percent
    higher_is_better: null
    sources: {primary: prs-eci-affidavits}
    geography_levels: [state]
    religions: [muslim]
    comparison_baselines: []
    phase: 2
    status: stub

  # ----- Justice (Phase 2) -----
  - id: prison-share
    name: Muslim share of prison population
    cluster: justice
    unit: percent
    higher_is_better: null
    definition: |
      Muslim share of total prison population (convicts + undertrials +
      detenues + other prisoners), among prisoners whose religion was
      reported. Compare against Muslim share of total population (~14.2%).
    sources: {primary: ncrb-prison}
    geography_levels: [national]
    religions: [muslim, hindu]
    methodology_notes: |
      NCRB PSI 2022 Tables 2.10C-2.13C. Maharashtra did not report religion
      breakdown for undertrials/detenues, so the religion-reported denominator
      excludes ~33k Maharashtra prisoners. Shares are computed over religion-
      reported prisoners only.
    comparison_baselines: []
    phase: 2
    status: defined

  - id: prison-rate-per-100k
    name: Prison population rate (per 100k of religious population)
    cluster: justice
    unit: per_100k_population
    higher_is_better: false
    definition: |
      Incarceration rate: prisoners of religion R per 100,000 of religion R's
      total population. More direct measure of disproportion than "share of
      prisoners" — comparable across religions without needing to know
      population baselines.
    sources:
      primary: ncrb-prison
      cross_check: [census-india-2011]
    geography_levels: [national]
    religions: [muslim, hindu, all]
    methodology_notes: |
      Cross-source: NCRB PSI 2022 total prisoner count (convicts + undertrials
      + detenues + other prisoners; STATES + UTs subtotals = ALL-INDIA by
      construction) divided by Census 2011 national religious population times
      100,000. The 'denominator' column on each canonical row records the exact
      (count, population) pair used. Caveat: Maharashtra non-reporting of
      religion for ~33k undertrials/detenues — religion-reported numerator
      excludes those; full national population is the denominator.
    comparison_baselines: [hindu, all]
    phase: 2
    status: defined

  - id: undertrial-rate-per-100k
    name: Undertrial population rate (per 100k of religious population)
    cluster: justice
    unit: per_100k_population
    higher_is_better: false
    definition: |
      Undertrial prisoners of religion R per 100,000 of religion R's total
      population. Sister metric to prison-rate-per-100k.
    sources:
      primary: ncrb-prison
      cross_check: [census-india-2011]
    geography_levels: [national]
    religions: [muslim, hindu, all]
    methodology_notes: |
      NCRB PSI 2022 Table 2.11C undertrial counts (STATES + UTs subtotals)
      divided by Census 2011 national religious population times 100,000.
      Same Maharashtra caveat as prison-rate-per-100k.
    comparison_baselines: [hindu, all]
    phase: 2
    status: defined

  - id: undertrial-share
    name: Muslim share of undertrial prisoners
    cluster: justice
    unit: percent
    higher_is_better: null
    definition: |
      Muslim share of undertrial prisoner population — those awaiting trial,
      not yet convicted. Compare against Muslim share of total population
      (~14.2%) and Muslim share of convicts (~17.1%).
    sources: {primary: ncrb-prison}
    geography_levels: [national]
    religions: [muslim, hindu]
    methodology_notes: |
      NCRB PSI 2022 Table 2.11C. Maharashtra did not report religion breakdown
      for ~33k undertrials; share is computed over religion-reported subset only.
    comparison_baselines: []
    phase: 2
    status: defined

  # ----- Civic / safety (Phase 2) -----
  - id: communal-incidents-govt
    name: Communal incidents (government-acknowledged)
    cluster: civic
    unit: count
    higher_is_better: false
    sources: {primary: mha-parliament-answers}
    geography_levels: [national, state]
    religions: []
    comparison_baselines: []
    phase: 2
    status: stub

  - id: communal-incidents-civic
    name: Communal / hate incidents (civic-recorded)
    cluster: civic
    unit: count
    higher_is_better: false
    sources: {primary: civic-incident-databases}
    geography_levels: [national, state, district]
    religions: []
    comparison_baselines: []
    phase: 2
    status: stub

  - id: civil-services-share
    name: Muslim share of central civil services intake
    cluster: civic
    unit: percent
    higher_is_better: null
    sources: {primary: rti-public-sector-employment}
    geography_levels: [national]
    religions: [muslim]
    comparison_baselines: [all]
    phase: 2
    status: stub

  # ----- Finance (Phase 2) -----
  - id: minority-psl-share
    name: Minority share of priority sector lending (aggregate minority)
    cluster: finance
    unit: percent
    higher_is_better: true
    sources: {primary: rbi-minority-lending}
    geography_levels: [national, state, district]
    religions: []
    comparison_baselines: []
    phase: 2
    status: stub
