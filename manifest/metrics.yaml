  # ----- Representation (Phase 2) -----
  - id: ls-share
    name: Muslim share of the Lok Sabha
    cluster: representation
    unit: percent
    higher_is_better: null
    definition: |
      Percentage of Lok Sabha members who are Muslim, by election cycle.
      Historical series covering all 18 general elections, 1952-2024.
    sources: {primary: prs-eci-affidavits}
    geography_levels: [national]
    religions: [muslim]
    methodology_notes: |
      Religion is not tabulated by either ECI or PRS Legislative Research
      in their official candidate-profile publications. Underlying data is
      ECI candidate affidavits classified post-election by journalists
      and researchers. Figures cross-verified across multiple sources:
      Maktoob Media, FACTLY, The India Forum, Statista. Documented as
      "manual entry" canonical with citations in each row's methodology note.
      The series covers all 18 general elections, 1952-2024: the 1952-2004
      figures are from historical compilations (The India Forum, Statista), 2009
      onward cross-verified across the sources above. Representation peaked near
      9% in 1980 and has sat around 4-5% since 2014: 2009=28/543 (5.2%),
      2014=22/543 (4.1%), 2019=27/543 (5.0%), 2024=24/543 (4.4%). Compare
      against the Muslim population share of ~14.2%, a chronic 9-10pp
      underrepresentation.
    comparison_baselines: []
    phase: 2
    status: defined
    display:
      scorecard:
        label: "Lok Sabha Muslim share"
        reference: null
        unit_format: percent
        higher_is_better: null
        order: 160
        special_render: time_series_latest

  - id: mla-share
    name: Muslim share of state assemblies
    cluster: representation
    unit: percent
    higher_is_better: null
    definition: |
      Percentage of state legislative assembly seats held by Muslim MLAs.
      National aggregate (~6%) plus per-assembly values for all 31
      state + UT assemblies that hold elections (28 states + Delhi,
      Puducherry, J&K, most-recent election per assembly, spanning 2020-2026).
    sources: {primary: prs-eci-affidavits}
    geography_levels: [national, state]
    religions: [muslim]
    methodology_notes: |
      Manual-entry metric, like ls-share: religion is not officially
      tabulated by ECI or PRS. Underlying data is candidate-affidavit
      religion classified post-election by journalists (Maktoob, Clarion,
      India Forum, The Wire, Deccan Herald, Outlook, Radiance Weekly,
      Free Press Journal, ummid.com, thenewzradar). National aggregate
      ~6% across the 31 covered assemblies. Highest: J&K 60% (2024,
      first election since Article 370 reorg); Kerala 25%, Assam 24.6%.
      Lowest: HP / Goa / Mizoram / Nagaland / Sikkim / Arunachal /
      Chhattisgarh / Tripura / Meghalaya, all 0% (most have never elected a
      Muslim MLA in state history). Each row's methodology_note cites the
      source compilation(s) used.
    comparison_baselines: []
    phase: 2
    status: defined
    display:
      scorecard:
        label: "State MLA Muslim share"
        reference: null
        unit_format: percent
        higher_is_better: null
        order: 170
        special_render: time_series_latest

  # ----- Justice (Phase 2) -----
  - id: prison-share
    name: Muslim share of prison population
    cluster: justice
    unit: percent
    higher_is_better: null
    definition: |
      Muslim share of total prison population (convicts + undertrials +
      detenues + other prisoners), among prisoners whose religion was
      reported. Compare against Muslim share of total population (~14.2%).
    sources: {primary: ncrb-prison}
    geography_levels: [national]
    religions: [muslim, hindu]
    methodology_notes: |
      NCRB PSI Tables 2.10C-2.13C, years 2018-2023 (2016/2017 not available
      from primary/archive sources, 2020 recovered from the NCRB Hindi-edition
      PSI; 2015 report has no religion-by-state table).
      Some states (e.g. Maharashtra) did not report religion for undertrials/
      detenues in several years, so each year's religion-reported denominator
      excludes them. Shares are computed over religion-reported prisoners only.
    comparison_baselines: []
    phase: 2
    status: defined
    # As of Commit AM (2026-06-02): prison-share is decarded in favour of
    # prison-rate-per-100k (which compares "% of community in prison" — the
    # cleaner statistical question than "% of prisoners who are Muslim"). The
    # multi-year share trend canonical is retained as cross-reference data.

  - id: prison-rate-per-100k
    name: Incarceration rate
    cluster: justice
    unit: per_100k_population
    higher_is_better: false
    definition: |
      Incarceration rate: prisoners of religion R per 100,000 of religion R's
      total population. More direct measure of disproportion than "share of
      prisoners", comparable across religions without needing to know
      population baselines.
    sources:
      primary: ncrb-prison
      cross_check: [census-india-2011]
    geography_levels: [national]
    religions: [muslim, hindu, all]
    methodology_notes: |
      Cross-source: NCRB PSI 2022 total prisoner count (convicts + undertrials
      + detenues + other prisoners; STATES + UTs subtotals = ALL-INDIA by
      construction) divided by Census 2011 national religious population times
      100,000. The 'denominator' column on each canonical row records the exact
      (count, population) pair used. Caveat: Maharashtra non-reporting of
      religion for ~33k undertrials/detenues, so the religion-reported numerator
      excludes those; full national population is the denominator.
    comparison_baselines: [hindu, all]
    phase: 2
    status: defined
    display:
      scorecard:
        label: "Muslim incarceration rate"
        reference: hindu
        unit_format: rate_per_100k
        higher_is_better: false
        order: 180

  - id: undertrial-rate-per-100k
    name: Undertrial rate
    cluster: justice
    unit: per_100k_population
    higher_is_better: false
    definition: |
      Undertrial prisoners of religion R per 100,000 of religion R's total
      population. Sister metric to prison-rate-per-100k.
    sources:
      primary: ncrb-prison
      cross_check: [census-india-2011]
    geography_levels: [national]
    religions: [muslim, hindu, all]
    methodology_notes: |
      NCRB PSI 2022 Table 2.11C undertrial counts (STATES + UTs subtotals)
      divided by Census 2011 national religious population times 100,000.
      Same Maharashtra caveat as prison-rate-per-100k.
    comparison_baselines: [hindu, all]
    phase: 2
    status: defined
    display:
      scorecard:
        label: "Muslim undertrial rate"
        reference: hindu
        unit_format: rate_per_100k
        higher_is_better: false
        order: 190

  - id: undertrial-share
    name: Muslim share of undertrial prisoners
    cluster: justice
    unit: percent
    higher_is_better: null
    definition: |
      Muslim share of undertrial prisoner population — those awaiting trial,
