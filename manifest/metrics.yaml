    higher_is_better: false
    definition: |
      Number of communal/religious rioting incidents recorded by NCRB under
      IPC Sec.147-151 (rioting), specifically the "Communal/Religious"
      sub-classification. National annual totals (2015-2023) plus state-level
      breakdown for 2022 and 2023.
    sources: {primary: ncrb-crime}
    geography_levels: [national, state]
    religions: [all]
    methodology_notes: |
      NCRB Crime in India, Table 1.2 row 23.1 'Communal/Religious' rioting.
      National series 2015-2023, compiled across multiple Crime in India
      volumes (CII 2017 through 2023, each carrying a multi-year national
      panel); state-level breakdown for 2022 and 2023. Incident counts only,
      with no religion of victim/perpetrator in the published table.
      Caveat: several states stopped recording 'communal' as a separate
      crime category since ~2017, which deflates the national total over
      time. Civil-society compilations typically report higher counts.
    comparison_baselines: []
    phase: 2
    status: defined
