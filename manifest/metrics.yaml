schema_version: 1

# Every metric on the dashboard must be defined here.
# Schema: manifest/schema/metric-entry.json

clusters:
  - id: demographics
    name: Demographics & geographic concentration
  - id: education
    name: Education
  - id: employment
    name: Employment & livelihoods
  - id: income
    name: Income, consumption, poverty
  - id: health
    name: Health & child wellbeing
  - id: housing
    name: Housing & basic amenities
  - id: finance
    name: Financial inclusion
  - id: representation
    name: Political representation
  - id: justice
    name: Justice & safety
  - id: civic
    name: Civic & public-sector access

metrics:

  # ----- Demographics (Phase 1) -----
  - id: pop-share
    name: Muslim share of population
    cluster: demographics
    unit: percent
    higher_is_better: null
    definition: |
      Muslim population as a share of total population at the given
      geography level.
    sources: {primary: census-india-2011}
    geography_levels: [national, state, district]
    religions: [muslim]
    methodology_notes: |
      Population shares from the primary RGI Census religion volumes, 1961 to
      2011. Two all-India figures exclude a state where the Census could not be
      held: 1981 excludes Assam and 1991 excludes Jammu & Kashmir. The 2021
      Census is delayed.
    comparison_baselines: []
    phase: 1
    status: defined
    display:
      scorecard:
        label: "Population share"
        reference: null
        unit_format: percent
        higher_is_better: null
        order: 10

  - id: urban-share
    name: Urban share
    cluster: demographics
    unit: percent
    higher_is_better: null
    definition: |
      Percentage of each community living in urban areas. Census Table C-01
      provides religion × residence (rural/urban) × sex breakdowns at national,
      state, district, and town levels; series covers Census 2001 and 2011.
    sources: {primary: census-india-2011}
    geography_levels: [national, state]
    religions: [muslim, hindu, christian, sikh, buddhist, jain, other, all]
    methodology_notes: |
      Urban share = urban_persons / total_persons * 100, per Census C-01.
      Two-census series (2001 and 2011) at national and state level; the 2021
      Census is delayed. Muslims (~40%) and Christians (~40%) are markedly more
      urbanised than the all-India average (~31%), a Sachar-era fact that
      conditions outcomes downstream (urban-poor labour markets, segregation,
      housing access).
    comparison_baselines: [hindu, all]
    phase: 1
    status: defined
    display:
      scorecard:
        label: "Urban share"
        reference: "hindu"
        unit_format: percent
        higher_is_better: null
        order: 20

  - id: sex-ratio
    name: Sex ratio
    cluster: demographics
    unit: females_per_1000_males
    higher_is_better: null
    definition: |
      Number of females per 1000 males in the population. A value below 1000
      means fewer women than men. Census series across six censuses, 1961-2011.
    sources: {primary: census-india-2011}
    geography_levels: [national, state, district]
    religions: [muslim, hindu, christian, sikh, buddhist, jain, other, all]
    methodology_notes: |
      Females / males * 1000 from Census religion tables across six censuses
      (1961-2011): 1961 Social & Cultural Tables C-VII, the 1971 and 1981
      census religion papers, 1991 C-09, 2001 C-01 and 2011 C-15. National for
      all six years; state-level for 2001 and 2011. Two all-India figures
      exclude a state where the Census could not be held: 1981 excludes Assam
      and 1991 excludes Jammu & Kashmir. The 2021 Census is delayed.
    comparison_baselines: [hindu, all]
    phase: 1
    status: defined
    display:
      scorecard:
        label: "Sex ratio"
        reference: "hindu"
        unit_format: females_per_1000_males
        higher_is_better: true
        order: 40

  - id: district-concentration-top100
    name: Concentration in top 100 districts
    cluster: demographics
    unit: percent
    higher_is_better: null
    definition: |
      Share of national Muslim population that lives in the top 100 districts
      ranked by absolute Muslim population. High values = geographically
      concentrated; low values = dispersed.
    sources: {primary: census-india-2011}
    geography_levels: [national]
    religions: [muslim]
    methodology_notes: |
      Computed by sorting all ~640 Indian districts by absolute Muslim
      population (per Census 2011 state MDDS C-1 files), taking the top 100,
      summing their Muslim residents, and dividing by national Muslim total.
      Denominator field on canonical row records exact numerator (top-100 sum)
      and denominator (national Muslim count).
    comparison_baselines: []
    phase: 1
    status: defined
    display:
      scorecard:
        # Decarded (Commit DV): the geographic-concentration story is now the
        # "By district" tab of the `pop-share` card. This metric keeps its
        # canonical CSV, which still feeds that tab (via _concentration_view).
        include: false
        label: "Top-100 concentration"
        reference: null
        unit_format: percent
        higher_is_better: null
        order: 30

  # ----- Education (Phase 1) -----
  - id: lit-7plus
    name: Literacy rate
    cluster: education
    unit: percent
    higher_is_better: true
    definition: |
      Share of population aged 7 and above who can both read and write
      with understanding in any language.
    sources: {primary: census-india-2011}
    geography_levels: [national, state, district]
    religions: [muslim, hindu, christian, sikh, buddhist, jain, other, all]
    methodology_notes: |
      Census defines literacy as the ability to read and write with
      understanding in any language. Two-census series (2001 and 2011, Census
      C-09 education-by-religion tables); both rounds share the same Census
      definition, so the 2001 -> 2011 change is a like-for-like comparison.
      PLFS reports a broadly similar literacy measure on a slightly different
      definition and is a possible future cross-check; no PLFS series is
      plotted here today.
    comparison_baselines: [hindu, all]
    phase: 1
    status: defined
    display:
      scorecard:
        label: "Literacy rate"
        reference: "hindu"
        unit_format: percent
        higher_is_better: true
        order: 100

  - id: mean-yrs-schooling
    name: Mean years of schooling (25+)
    cluster: education
    unit: years
    higher_is_better: true
    sources: {primary: nfhs-5}
    geography_levels: [national, state]
    religions: [muslim, hindu, sc, st, all]
    comparison_baselines: [hindu, sc, all]
    phase: 1
    status: stub

  - id: ger-higher-ed
    name: Higher education enrolment rate
    cluster: education
    unit: percent
    higher_is_better: true
    definition: |
      Gross Enrolment Ratio = student enrolment in higher education / population
      in the 18-23 age cohort * 100. The AISHE-published headline GER. Higher
      education means any course after Class 12: degree, diploma, and
      certificate programmes at universities, colleges, and standalone
      institutions.
    sources:
      primary: aishe
      cross_check: [census-india-2011]
    geography_levels: [national, state]
    religions: [muslim, other_minority, all]
    methodology_notes: |
      Numerator: AISHE All-India "Muslim Minority" enrolment for two rounds,
      academic years 2020-21 (Muslim 19,21,713; total 4,13,80,713 per Report p30)
      and 2021-22 (Muslim 21,08,033; total 4,32,68,181 per Report p29); the
      2020-21 All-India cells were recovered by character-level de-interleaving of
      the Table 15 text layer and match the exact sum of its 36 state rows.
      Denominator: Census 2011 C-15 (15-19 + 20-24) × 0.6 as an 18-23 effective-
      cohort proxy, held fixed across both rounds; single-year-age table (C-13)
      not pulled and 2021 Census deferred. The older 2011 denominator makes our
      computed GER run a few points ABOVE the officially published figures
      (national 27-28%; published Muslim Minority GER around 9% in recent AISHE
      rounds). The absolute level is a computation, not an official figure, but
      the cross-religion gap (Muslim enrolment runs at roughly one-third the
      national rate) is robust to the choice of denominator and is the dashboard
      story; with the denominator fixed, the small rise between the two rounds is
      enrolment growth alone. The card also sets
      Muslims beside "Other minorities" (Christian, Sikh, Buddhist and Jain,
      9,05,159 students), which AISHE reports only as one grouped category and
      never splits: Muslims enrol at roughly three-quarters their rate. AISHE
      publishes no separate Hindu figure, so there is no Hindu bar. The by-sex
      view shows Muslim women enrol at a marginally higher rate than Muslim men;
      the by-state view ranks Muslim GER across states from enrolment as reported
      by each state to AISHE (incomplete in some states, so the spread matters
      more than the exact level).
    comparison_baselines: [all, other_minority]
    phase: 1
    status: defined
    display:
      scorecard:
        label: "Higher-education enrolment rate"
        reference: "all"
        unit_format: percent
        higher_is_better: true
        order: 110

  - id: muslim-higher-ed-enrolment
    name: Muslim students in higher education
    cluster: education
    unit: count
    higher_is_better: null
    definition: |
      Total number of students classified as "Muslim Minority" enrolled in
      higher education institutions, per AISHE annual reporting.
    sources: {primary: aishe}
    geography_levels: [national, state]
    religions: [muslim]
    methodology_notes: |
      AISHE classifies enrolment as "Muslim Minority" vs "Other Minority
      Community" (Christians, Sikhs, Buddhists, Jains, Parsis), with Hindu
      enrolment implied as residual. This metric publishes only the
      absolute Muslim enrolment. Muslim *share* of total enrolment is a
      separate metric that requires Total Enrolment by state (separate
      AISHE table not yet extracted).
    comparison_baselines: []
    phase: 1
    status: defined
    display:
      scorecard:
        include: false   # decarded: folded into ger-higher-ed's By state + By sex tabs (Students column beside GER)
        label: "Higher-education enrolment (count)"
        reference: null
        unit_format: count
        higher_is_better: null
        order: 120

  # ----- Employment (Phase 1) -----
  - id: lfpr-15plus
    name: Labour force participation
    cluster: employment
    unit: percent
    higher_is_better: true
    definition: |
      Share of population age 15+ who are in the labour force (either
      working or actively seeking work). Usual status (principal + subsidiary).
    sources: {primary: plfs}
    geography_levels: [national]
    religions: [muslim, hindu, all]
    methodology_notes: |
      The 2023-24 point is PLFS 2023-24 Table 48 (pages 396-400), total
      residence, person-level; reference period Jul 2023 - Jun 2024 (year=2023
      in the canonical row is the start of this period). The earlier points
      (2017-18 to 2022-23) are computed from each round's unit-level microdata,
      pulled via the MoSPI NADA API: the report PDFs publish the 15+ religion
      split only for their own year, but the microdata carries household
      religion in every round. The computation reproduces each round's
      published all-India LFPR to 0.1 points and the 2023-24 religion table
      within 0.2, so the published point extends the same series. Religion is
      self-reported (NSO unit-data rider: indicative, no sub-state estimates).
      The "Working vs looking" tab sets this rate against the worker population
      ratio (share actually working, wpr-15plus.csv) from the same source; the
      gap between them is unemployment.
    comparison_baselines: [hindu, all]
    phase: 1
    status: defined
    display:
      scorecard:
        label: "Labour-force participation"
        reference: "hindu"
        unit_format: percent
        higher_is_better: true
        order: 130

  - id: wpr-15plus
    name: Worker population ratio
    cluster: employment
    unit: percent
    higher_is_better: true
    definition: |
      Share of population age 15+ who are currently working. Usual status
      (principal + subsidiary). WPR = LFPR - Unemployed.
    sources: {primary: plfs}
    geography_levels: [national]
    religions: [muslim, hindu, all]
    methodology_notes: |
      The 2023-24 point is PLFS 2023-24 Table 48 (pages 396-400), total
      residence, person-level. The earlier points (2017-18 to 2022-23) are
      computed from each round's unit-level microdata via the MoSPI NADA API
      (reproduces published all-India figures to 0.1 points; religion is
      self-reported per the NSO unit-data rider).
    comparison_baselines: [hindu, all]
    phase: 1
    status: defined
    display:
      scorecard:
        include: false   # decarded: folded into lfpr-15plus's "Working vs looking" tab (WPR shown beside the labour-force rate; the two differ only by unemployment)
        label: "Worker-population ratio"
        reference: "hindu"
        unit_format: percent
        higher_is_better: true
        order: 140

  - id: unemployment-rate-15plus
    name: Unemployment rate
    cluster: employment
    unit: percent
    higher_is_better: false
    definition: |
      Share of the labour force, age 15+, that is unemployed: actively seeking
      or available for work but not working. Usual status (principal +
      subsidiary). A low rate is not automatically good news here: people who
      cannot afford to be unemployed take any informal work, so read this
      beside the salaried-jobs card.
    sources: {primary: plfs-microdata}
    geography_levels: [national]
    religions: [muslim, hindu, all]
    methodology_notes: |
      All seven points (2017-18 to 2023-24) are computed from each round's PLFS
      unit-level microdata, pulled via the MoSPI NADA API: the published annual
      reports never break the unemployment rate down by religion, so the
      microdata is the only source for this series. Unemployed = usual principal
      status 81 (seeking/available for work); labour force = workers (ps+ss)
      plus unemployed; weights per the official estimation rule. The computation
      reproduces each round's published all-India unemployment rate to 0.1
      points. Muslim unemployment fell from 7.2% (2017-18, a point above the
      national 6.0%) to 3.2% (2023-24, at par with the national average), but
      over the same rounds the salaried share of Muslim workers also fell, so
      part of the convergence is absorption into self-employment and casual
      work rather than formal hiring. Religion is self-reported (NSO unit-data
      rider: indicative, no sub-state estimates). Year=Y is the start of the
      Jul-Y to Jun-(Y+1) reference period.
    comparison_baselines: [hindu, all]
    phase: 1
    status: defined
    display:
      scorecard:
        label: "Unemployment rate"
        reference: "hindu"
        unit_format: percent
        higher_is_better: false
        order: 145

  - id: salaried-share
    name: Workers in salaried jobs
    cluster: employment
    unit: percent
    higher_is_better: true
    definition: |
      Percentage of workers (usual status, ps+ss) employed in regular
      wage/salary positions (as opposed to self-employed or casual labour).
    sources: {primary: plfs}
    geography_levels: [national]
    religions: [muslim, hindu, all]
    methodology_notes: |
      The 2023-24 point is PLFS 2023-24 Table 49 (pages 401-402), rural+urban
      person-level. Muslims are disproportionately self-employed (62.2% vs
      Hindu 58.3%) and under-represented in formal salaried work, the classic
      Sachar-era finding on labour-market segregation. The earlier points
      (2017-18 to 2022-23) are computed from each round's unit-level microdata
      via the MoSPI NADA API (the PDFs publish this religion split only for
      their own year; the computation reproduces the 2023-24 published table
      within 0.2 points). The trend adds a sharper read: Muslim labour-force
      participation rose over the seven rounds, but the salaried share of
      Muslim workers FELL from its 2018-19 peak (22.2%) to 18.0%, so the
      participation gains came in self-employment and casual work, not
      regular salaried jobs. Religion is self-reported (NSO unit-data rider).
    comparison_baselines: [hindu, all]
    phase: 1
    status: defined
    display:
      scorecard:
        label: "Regular salaried share"
        reference: "hindu"
        unit_format: percent
        higher_is_better: true
        order: 150

  - id: salaried-earnings
    name: Monthly earnings in salaried jobs
    cluster: employment
    unit: inr_per_month
    higher_is_better: true
    definition: |
      Average monthly earnings (gross, preceding calendar month) of workers in
      regular salaried/wage jobs, age 15+. The pay counterpart to the
      salaried-jobs card: Muslims are both less likely to hold a regular
      salaried job and, when they do, are paid less in it.
    sources: {primary: plfs-microdata}
    geography_levels: [national]
    religions: [muslim, hindu, all]
    methodology_notes: |
      All seven points (2017-18 to 2023-24) are computed from each round's PLFS
      unit-level microdata via the MoSPI NADA API: the published annual reports
      never break earnings down by religion. Earnings are those received or
      receivable during the preceding calendar month from the regular
      salaried/wage activity (schedule block 6 item 9, asked of persons with
      current weekly status 31/71/72), averaged with the official annual
      first-visit weights among reporting employees age 15+. The estimator is
      anchored: it reproduces the published all-ages earnings tables of the
      2021-22, 2022-23 and 2023-24 reports across all 27 cells (residence x
      sex) within 0.03%, with exactly matching sample counts. Rupees are
      nominal, so levels mostly reflect inflation; the comparable story is the
      relative gap - Muslim salaried workers earn 16-23% below the all-India
      average in every round (2023-24: Rs 17,747 vs Rs 21,067), and the gap has
      not closed over the seven rounds. Muslim sample: 4,070-5,122 earnings
      reporters per round. Religion is self-reported (NSO unit-data rider:
      indicative, no sub-state estimates). Year=Y is the start of the Jul-Y to
      Jun-(Y+1) reference period.
    comparison_baselines: [hindu, all]
    phase: 1
    status: defined
    display:
      scorecard:
        label: "Salaried earnings"
        reference: "all"
        unit_format: inr_per_month
        higher_is_better: true
        order: 152

  # ----- Income / consumption / poverty (Phase 1) -----
  - id: mpce
    name: Monthly spending per person
    cluster: income
    unit: inr_per_month
    higher_is_better: true
    definition: |
      Average monthly spending per person (Monthly Per Capita Consumption
      Expenditure, MPCE). In India this is the standard measure of economic
      well-being, used in place of income, for which no reliable figure by
      religion exists.
    sources:
      primary: hces-2023-24
    geography_levels: [national, state]
    religions: [muslim, hindu, all]
    methodology_notes: |
      The 2023-24 figure is computed from the unit-level microdata of HCES 2023-24
      (NSO, 2.61 lakh households), pulled via the MoSPI NADA API: weighted monthly
      per capita consumption expenditure (food + consumables & services + durables,
      365-day items annualised), cross-classified by the religion of the household
      head. The method reproduces the published national MPCE (rural Rs.4,122 /
      urban Rs.6,996) within about 2% before the religion split is taken. NSO's
      note for unit-level users cautions that religion is self-reported and
      unverified and that the survey is designed to estimate MPCE with the State/UT
      as the basic stratum, so the religion figures are best read as indicative, no
      sub-state estimates are made, and the survey's internal Muslim population
      share (13%) sits a little below the Census. The earlier benchmark is the
      Sachar Committee (2006) from the NSS 61st round (2004-05): Muslims Rs.635 vs
      the all-India Rs.712, near SC/ST (Rs.520) and far below upper-caste 'Hindu
      General' households (Rs.1023). The two rounds use different consumption
      methods (2004-05 URP vs 2023-24 MMRP) and rupees are nominal, so the level
      change over time is mostly inflation; the comparable story is the relative
      gap, which is stable at about 10% below the national average across the 20
      years and is widest in towns (urban Muslims Rs.5,467 vs urban Hindus
      Rs.7,064). The By state tab shows the 2023-24 per-state Muslim MPCE computed
      from the same microdata, urban and rural separately (State/UT is the survey's
      basic stratum, so this is the finest permitted cut; cells with fewer than 30
      sampled Muslim households are suppressed). The Sachar 2004-05 state figures
      remain in the downloadable data file.
    comparison_baselines: [all]
    phase: 1
    status: defined
    display:
      scorecard:
        label: "Monthly spending"
        reference: "all"
        unit_format: inr_per_month
        higher_is_better: true
        order: 155

  - id: top-quintile-share
    name: Share in India's top spending fifth
    cluster: income
    unit: percent
    higher_is_better: true
    definition: |
      Of all people in a community, the share living in households whose
      spending (MPCE) places them in the top 20% of Indians. If prosperity were
      spread evenly, every community would sit at 20%. This reads the whole
      spending distribution, not the average: Muslims are NOT over-represented
      among India's poorest fifth (20.5%, at par), but only 13.7% reach the top
      fifth - the distribution is squeezed below the top.
    sources: {primary: hces-2023-24}
    geography_levels: [national]
    religions: [muslim, hindu, christian, sikh, all]
    methodology_notes: |
      Computed from HCES 2023-24 unit-level microdata (NSO, 2.61 lakh
      households) via the MoSPI NADA API, with the same validated MPCE
      machinery as the spending card: person-weighted national MPCE quintile
      cuts (Rs 2,903 / 3,677 / 4,632 / 6,302 per person per month), then each
      community's population share within each fifth. Every all-India quintile
      share equals 20.0 by construction, which is the built-in validation. The
      full distribution (Muslim, % in Q1 poorest to Q5 richest): 20.5, 24.0,
      22.7, 19.1, 13.7. The urban gap is the sharpest cut: 26.3% of urban
      Muslims reach the national top fifth vs 45.3% of urban Hindus. The
      "Urban vs rural" tab uses the SAME national cuts, so it reads as the
      share of the community's urban (rural) population reaching the national
      top fifth. NSO unit-data rider: religion is self-reported and unverified
      and the survey is designed for MPCE estimation, so the religion split is
      indicative and no sub-state estimates are made.
    comparison_baselines: [hindu, all]
    phase: 1
    status: defined
    display:
      scorecard:
        label: "Top spending fifth"
        reference: "all"
        unit_format: percent
        higher_is_better: true
        order: 156

  - id: mpi-headcount
    name: Multidimensional Poverty Index headcount ratio
    cluster: income
    unit: percent
    higher_is_better: false
    sources: {primary: niti-mpi}
    geography_levels: [national, state, district]
    religions: [muslim, hindu, sc, st, all]
    comparison_baselines: [hindu, all]
    phase: 1
    status: stub

  # ----- Health (Phase 1) -----
  - id: imr
    name: Infant mortality rate
    cluster: health
    unit: per_1000_live_births
    higher_is_better: false
    definition: |
      Probability of dying before the first birthday, expressed per 1000
      live births, for the period preceding each survey round.
    sources:
      primary: nfhs-5
      cross_check: [census-india-2011]
    geography_levels: [national]
    religions: [muslim, hindu, all]
    methodology_notes: |
      Time series across four NFHS rounds: NFHS-2 (1998-99), NFHS-3 (2005-06),
      NFHS-4 (2015-16) and NFHS-5 (2019-21); years 1998/2005/2015/2020 are the
      round labels. For NFHS-5, Table 7.2 publishes URBAN and RURAL IMR by
      religion separately with no total-residence-by-religion column, so the
      national total is a population-weighted average using Census 2011
      urban/rural population by religion as weights (<1% drift; urban/rural
      shares by religion are stable). Earlier rounds come from each report's
      religion table; every canonical row's methodology_note records its exact
      source.
    comparison_baselines: [hindu, all]
    phase: 1
    status: defined
    display:
      scorecard:
        label: "Infant mortality rate"
        reference: "hindu"
        unit_format: per_1000_live_births
        higher_is_better: false
        order: 60

  - id: stunting-u5
    name: Child stunting (under 5)
    cluster: health
    unit: percent
    higher_is_better: false
    definition: |
      Percentage of children under age 5 classified as stunted (height-for-age
      more than 2 SD below the WHO Child Growth Standards median). Stunting
      indicates chronic malnutrition in early life.
    sources: {primary: nfhs-5}
    geography_levels: [national]
    religions: [muslim, hindu, christian, sikh, buddhist, jain, all]
    methodology_notes: |
      NFHS-5 (2019-21) Table 10.1 (Nutritional status of children by background
      characteristics). Religion column = % below -2 SD HFA; all-India value
      is the sample-size-weighted average of the 6 religion rows (reproduces
      the published national rate of 35.5%). Single round in canonical for now;
      NFHS-2/3/4 extension possible (same pattern as IMR / inst-delivery / anaemia
      trend extractors).
    comparison_baselines: [hindu, all]
    phase: 1
    status: defined
    display:
      scorecard:
        label: "Children stunted (under 5)"
        reference: "hindu"
        unit_format: percent
        higher_is_better: false
        order: 70

  - id: inst-delivery
    name: Institutional delivery rate
    cluster: health
    unit: percent
    higher_is_better: true
    definition: |
      Percentage of live births in the years preceding each survey round that
      took place in a health facility (public or private), among women age 15-49.
    sources: {primary: nfhs-5}
    geography_levels: [national]
    religions: [muslim, hindu, all]
    methodology_notes: |
      Time series across four NFHS rounds: NFHS-2 (1998-99), NFHS-3 (2005-06),
      NFHS-4 (2015-16) and NFHS-5 (2019-21); years 1998/2005/2015/2020 are the
      round labels. For NFHS-5, Table 8.13 (page 324); the "all" value is a
      sample-size-weighted average of the 7 religion rates (the published Total
      row was hard to extract cleanly from the dual-column PDF layout) and
      matches NFHS-5's published 88.6% within rounding. Earlier rounds come from
      each report's facility-delivery religion table; every canonical row's
      methodology_note records its exact source.
    comparison_baselines: [hindu, all]
    phase: 1
    status: defined
    display:
      scorecard:
        label: "Institutional delivery rate"
