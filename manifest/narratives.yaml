narratives:

  # ----- Literacy, age 7+ (Census). higher is better. Muslims BEHIND. -----
  lit-7plus:
    bottom_line: >-
      Just under 69% of Muslims aged 7 and above could read and write in 2011,
      the lowest literacy rate among India's larger religious communities and
      about five points behind Hindus. The gap has been narrowing slowly since
      2001, but it stays widest for Muslim women and in rural areas, where
      barely three in five Muslims are literate.
    how_to_read: >-
      The main chart tracks literacy for each community across the 2001 and 2011
      censuses, with Muslims in maroon and the all-India average as the dashed
      line; a rising line means literacy is improving. Because the distance
      between communities is the point, the vertical axis does not start at zero.
      The tabs break the same measure down further: By state shows how far the
      Muslim rate swings across India, By sex exposes the wide gap between Muslim
      men and women, and Urban vs rural shows how much lower literacy runs in
      Muslim villages than in Muslim towns.
    why_it_matters: >-
      Literacy is the floor every other opportunity stands on. It shapes access
      to formal jobs, government services and scholarships, and a household's
      ability to handle paperwork, health information and its own legal rights.
      A community that starts behind on literacy tends to stay behind on income,
      formal work and schooling in the generation that follows.
    status_note: >-
      The gap has closed by roughly a point and a half since 2001, slow but
      steady progress, and it remains widest for Muslim women and in rural areas.
    # Potential drivers: MECE buckets - demand (poverty), supply (access),
    # retention (dropout), gender (female gap), governance (delivery).
    drivers:
      - title: "Poverty"
        text: >-
          Muslims are disproportionately poor and concentrated in informal urban
          work, so children are pulled toward earning rather than staying in
          school {{cite:sachar-2006}}.
      - title: "School access"
        text: >-
          The Sachar Committee found too few schools in many Muslim-majority
          localities, leaving children further from a classroom
          {{cite:sachar-2006}}.
      - title: "Early dropout"
        text: >-
          Muslims had the highest school dropout rate of any large community, most
          leaving around the move from primary to secondary {{cite:sachar-2006}}.
      - title: "The female gap"
        text: >-
          Literacy is lowest of all for Muslim women, so half the community starts
          furthest behind, and a mother's literacy shapes the next generation.
      - title: "Patchy delivery"
        text: >-
          The 2014 Post-Sachar review found remedial schemes existed on paper but
          reached Muslim children unevenly, so gaps persisted through weak delivery
          as much as missing policy {{cite:post-sachar-2014}}.
    levers:
      - title: "Deliver existing aid"
        text: >-
          The Pre-Matric, Post-Matric and Merit-cum-Means scholarships already
          exist; the Post-Sachar priority is consistent delivery, not new schemes
          {{cite:post-sachar-2014}}.
      - title: "Stop early dropout"
        text: >-
          Target the primary-to-secondary transition, where Muslim dropout is
          highest {{cite:sachar-2006}}.
      - title: "Prioritise girls"
        text: >-
          Close the female literacy gap, the widest single sub-gap within the
          community.
      - title: "Back minority schools"
        text: >-
          Protect and strengthen Article 30 minority institutions through the
          National Commission for Minority Educational Institutions.
    stakeholders:
      - name: "Ministry of Minority Affairs"
        url: "https://www.minorityaffairs.gov.in/"
        mission: >-
          The Union ministry, created in 2006, that runs scholarship and
          development schemes for India's notified minorities, including the
          Pre-Matric, Post-Matric and Merit-cum-Means scholarships.
      - name: "National Commission for Minority Educational Institutions"
        url: "https://ncmei.gov.in/"
        mission: >-
          A statutory body that protects the right of religious and linguistic
          minorities to set up and run their own schools and colleges under
          Article 30 of the Constitution.
      - name: "Zakat Foundation of India"
        url: "https://www.zakatindia.org/Scholarship.html"
        donate_url: "https://www.zakatindia.org/Donate.html"
        credibility:
          label: "80G + FCRA"
          url: "https://www.zakatindia.org/Donate.html"
        mission: >-
          An Indian trust that channels Zakat into competitive-exam coaching,
          scholarships, skill training and orphan care for the Muslim community.
      - name: "Human Welfare Foundation"
        url: "https://www.hwfindia.org/category/education/"
        donate_url: "https://www.hwfindia.org/donate/"
        mission: >-
          A foundation whose Vision 2026 programme builds and supports schools
          and runs scholarships, health and livelihood projects in disadvantaged,
          largely minority areas across India.
      - name: "Association of Muslim Professionals"
        url: "https://www.ampindia.org/AMP_Scholarship_Fund"
        donate_url: "https://www.ampindia.org/make_a_donation"
        mission: >-
          A volunteer professionals' body that runs higher-education scholarships,
          a national talent search and school-development work to widen Muslim
          access to education.
      - name: "Muslim Education Trust, Delhi"
        url: "https://metdelhi.org/scholarships/"
        mission: >-
          A voluntary educational trust that administers Islamic Development Bank
          and its own scholarships for minority students.
      - name: "Markazul Ma'arif"
        url: "https://markazulmaarif.org/education/"
        donate_url: "https://markazulmaarif.org/donation/"
        credibility:
          label: "FCRA registered"
          url: "https://markazulmaarif.org/society-registration-number/"
        mission: >-
          An Assam-based NGO that runs schools for educationally backward
          communities alongside relief, health and skills work, open to all
          irrespective of faith.
      - name: "Aga Khan Education Service, India"
        url: "https://akf.org/country/india/"
        credibility:
          label: "FCRA registered"
          url: "https://akf.org/country/india/"
        mission: >-
          The Aga Khan network's Indian education arm, running schools and
          early-childhood programmes. Founded by the Ismaili community, it serves
          all communities.
      - name: "Pratham"
        url: "https://pratham.org/programs/education/"
        donate_url: "https://pratham.org/donation/"
        credibility:
          label: "GiveIndia vetted"
          url: "https://give.do/discover/17G3/pratham-education-foundation/"
        mission: >-
          One of India's largest education NGOs, raising children's foundational
          reading and arithmetic, and the producer of the annual ASER learning
          survey.

  # ----- Infant Mortality Rate (NFHS). lower is better. Muslims AHEAD. -----
  imr:
    bottom_line: >-
      Muslims have lower infant mortality than Hindus, and have done so in every
      national survey since the 1990s, despite being poorer on most other
      measures. In the latest survey, 2019-21, about 33 Muslim infants died
      before their first birthday for every 1,000 born, against 35 among Hindus.
      This Muslim survival advantage is real but shrinking, as mortality has
      fallen faster among other communities.
    how_to_read: >-
      The main chart tracks infant deaths per 1,000 live births for each
      community across four National Family Health Surveys from 1998 to 2019-21;
      here a falling line is good news, since lower is better. Every community's
      line drops steeply, so the chart shows both the broad decline and the
      narrowing distance between communities. The Urban vs rural tab splits each
      rate into town and village, where most infant deaths still happen, and
      shows the Muslim advantage is largely a rural one.
    why_it_matters: >-
      Infant mortality is one of the most sensitive measures of a population's
      living conditions, capturing the combined effect of nutrition, sanitation,
      maternal health and access to care in the first, most fragile year of life.
      That Muslims do better here than richer communities is one of the most
      studied puzzles in Indian demography, and a reminder that income alone does
      not determine survival.
    status_note: >-
      Muslims have recorded lower infant mortality than Hindus in every survey
      since 1998, but the advantage has shrunk from roughly 18 points then to
      about 2 today as mortality fell faster among other communities.
    # Potential drivers: MECE buckets - external environment (sanitation),
    # maternal-biological (the part the data explains), and the unexplained
    # residual (the genuine puzzle).
    drivers:
      - title: "Sanitation"
        text: >-
          Muslim neighbourhoods practise less open defecation, and this local
          difference alone accounts for a large share of the survival gap, an
          effect that protects Hindu neighbours too {{cite:geruso-spears-2018}}.
      - title: "Maternal health"
        text: >-
          The part researchers can explain comes mainly from mothers' height and
          diet, not the breastfeeding or birth-spacing stories often repeated in
          the press {{cite:bhalotra-2010}}.
      - title: "Still a puzzle"
        text: >-
          After income, education and the usual risk factors are accounted for,
          those predict Muslims should fare worse, not better, so most of the
          advantage stays unexplained {{cite:bhalotra-2010}}.
    levers:
      - title: "Sanitation for all"
        text: >-
          The gain tied most directly to infant survival; it saves lives
          everywhere and erodes the Muslim edge as open defecation falls
          {{cite:geruso-spears-2018}}.
      - title: "Maternal and newborn care"
        text: >-
          The National Health Mission's immunisation, institutional delivery and
          newborn care is the main public instrument.
      - title: "Stick to the basics"
        text: >-
          Because the advantage itself is mostly unexplained, the surest gains
          come from what helps every infant, not from trying to bottle what Muslim
          households are doing right {{cite:bhalotra-2010}}.
    # Note: genuinely Muslim-specific maternal-child-health NGOs in India are
    # scarce; the Aga Khan health network is the one Muslim-founded MCH operation,
    # so the rest of this list is the credible secular MCH field (honest fill).
    stakeholders:
      - name: "Ministry of Health and Family Welfare"
        url: "https://mohfw.gov.in/"
        mission: >-
          The Union ministry responsible for India's health policy and its
          family-planning, maternal-health and child-health programmes.
      - name: "National Health Mission"
        url: "https://nhm.gov.in/index1.php?lang=1&level=1&sublinkid=794&lid=168"
        mission: >-
          The Government of India's flagship health programme, working toward
          affordable, quality care including maternal, newborn and child health
          services across rural and urban India.
      - name: "Aga Khan Health Services, India"
        url: "https://the.akdn/en/where-we-work/south-asia/india/health-india"
        mission: >-
          The Aga Khan network's Indian health arm, running maternal and child
          health services including a maternal and child care centre in Hyderabad
          and rural reproductive, child-health and nutrition work. Founded by the
          Ismaili community, it serves all communities.
      - name: "SEWA Rural"
        url: "https://sewarural.org/hospital-services/"
        donate_url: "https://sewarural.org/donate-now/"
        credibility:
          label: "Credibility Alliance accredited"
          url: "https://sewarural.org/awards-recognitions/"
        mission: >-
          A voluntary organisation in tribal south Gujarat whose Kasturba Hospital
          and community programmes deliver maternal and newborn care, with large
          reported falls in maternal and neonatal deaths in its area.
      - name: "Doctors For You"
        url: "https://doctorsforyou.org/public-health/rural-maternal-health-care-bihar.php"
        donate_url: "https://pages.razorpay.com/pl_I8hBrG9gTuRV40/view"
        credibility:
          label: "GiveIndia vetted"
          url: "https://give.do/ngos/doctors-for-you"
        mission: >-
          A humanitarian health NGO providing rural maternal and child health,
          treatment of severe acute malnutrition and disaster medical care across
          several states.
      - name: "Jhpiego India"
        url: "https://jhpiego.org/where-we-work/india/"
        donate_url: "https://jhpiego.org/ways-to-give/donate/"
        mission: >-
          A Johns Hopkins-affiliated non-profit that strengthens maternal and
          newborn care in India by training frontline health workers and
          supporting government programmes.
      - name: "UNICEF India"
        url: "https://www.unicef.org/india/what-we-do"
        mission: >-
          The UN Children's Fund's India office, working with states on child
          survival, immunisation and maternal and newborn health.
      - name: "International Institute for Population Sciences"
        url: "https://www.iipsindia.ac.in/"
        mission: >-
          The Mumbai institute that conducts the National Family Health Survey,
          the source of India's infant-mortality and maternal and child health
          figures by population group.

  # ===================================================================
  # PHASE 2 - BATCH 1: Education + Health (reuse verified stakeholder sets)
  # ===================================================================

  # ----- Higher-education attendance (NSS 75th). higher is better. Muslims BEHIND. -----
  ger-higher-ed:
    bottom_line: >-
      Just 14.5% of Muslims aged 18 to 23 were attending higher education in
      2017, against 24.2% of Hindus and 22.8% nationally: the lowest rate of any
      major community. Fewer than 15 in every 100 college-age Muslims are in a
      degree course, so the school-level literacy gap widens into a much larger
      gap at the top of the system.
    how_to_read: >-
      The chart sets the Muslim higher-education attendance rate beside Hindus,
      the all-India average and other communities for 2017, the one year a
      household survey measured it the same way for everyone; taller is better.
      This is a single snapshot, not a trend, so there is no line over time. The
      By sex tab splits the rate into Muslim men and women.
    why_it_matters: >-
      Higher education is the gateway to secure, salaried and professional work.
      A community that sends a far smaller share of its young people to college
      stays concentrated in informal, low-paid jobs, and the disadvantage
      compounds across generations.
    status_note: >-
      This is the widest community gap on the dashboard at the top of the
      education ladder, and it follows directly from the weaker school completion
      that comes before it.
    drivers:
      - title: "Poverty"
        text: >-
          Higher education costs money and forgoes a wage, so poorer Muslim
          households pull young people into work before college {{cite:sachar-2006}}.
      - title: "The school pipeline"
        text: >-
          With the highest school dropout of any large community, far fewer
          Muslims reach Class 12 in the first place, the gate to any degree
          {{cite:sachar-2006}}.
      - title: "First-generation barrier"
        text: >-
          With few graduate parents, Muslim students navigate admissions,
          entrance exams and scholarships without family experience to draw on
          {{cite:sachar-2006}}.
      - title: "Not madrasas"
        text: >-
          The common claim that Muslims choose religious schooling over college
          is not the cause: Sachar found only about 4% of Muslim children attend
          a madrasa {{cite:sachar-2006}}.
      - title: "Uneven delivery"
        text: >-
          Scholarships and reservations exist on paper but reach Muslim students
          unevenly {{cite:post-sachar-2014}}.
    levers:
      - title: "Fix the pipeline first"
        text: >-
          The largest gains come earlier, by keeping Muslim students in school
          through to Class 12 {{cite:sachar-2006}}.
      - title: "Deliver scholarships reliably"
        text: >-
          The Post-Matric and Merit-cum-Means schemes exist; the Post-Sachar
          priority is consistent delivery, not new schemes {{cite:post-sachar-2014}}.
      - title: "Reach girls"
        text: >-
          The female shortfall is widest at this level, so women's access moves
          the rate the most.
      - title: "Back minority colleges"
        text: >-
          Protect and strengthen Article 30 minority higher-education
          institutions through the National Commission for Minority Educational
          Institutions.
    stakeholders_from: lit-7plus

  # ----- Per-student school spending (NSS/CMS:E). descriptive (lighter). -----
  school-edu-spend:
    bottom_line: >-
      In 2025 a Muslim household spent about INR 9,249 a year on one school
      child's fees, books, uniform and transport, against INR 12,941 in a Hindu
      household and INR 12,616 nationally. Both communities lean on free
      government schools at similar rates, so the shortfall of more than a
      quarter reflects what families can afford to add on top, not a different
      choice of school.
    how_to_read: >-
      The chart compares yearly per-student school spending across communities
      for 2017 and 2025; this is money spent, not an outcome, so neither higher
      nor lower is automatically good. Private coaching is excluded. The Urban vs
      rural tab shows the gap is widest in towns, where better-off families spend
      the most.
    why_it_matters: >-
      What a family can put behind each child, the books, a uniform, transport
      and the occasional extra, shapes how well that child does in the same
      classroom. Persistent under-spending is one of the quiet ways an income gap
      turns into an education gap.
    status_note: >-
      The gap has held as spending rose across the board, so Muslim families are
      adding less per child even as every community spends more.

  # ----- Child stunting under 5 (NFHS). lower is better. Muslims slightly BEHIND. -----
  stunting-u5:
    bottom_line: >-
      In 2019-21, 36.8% of Muslim children under five were stunted, too short
      for their age from chronic undernutrition, just above Hindus at 35.5% and
      the national 35.5%. It is a striking counterpoint to infant mortality,
      where Muslim children do better: they are more likely to survive infancy,
      yet slightly more likely to grow up stunted.
    how_to_read: >-
      The chart compares the share of under-five children who are stunted across
      communities for 2019-21, the latest National Family Health Survey; here
      lower is better. Stunting builds up over the whole of early childhood
      rather than at a single moment, so it shifts slowly.
    why_it_matters: >-
      Stunting in the first years is largely irreversible and predicts weaker
      school performance, lower adult earnings and poorer health for life. It is
      one of the clearest early signs of how poverty passes to the next
      generation.
    status_note: >-
      The Muslim figure sits just above the Hindu one, but both are far above the
      levels seen for Christian, Sikh and Jain children, a sign that this is a
      poverty gap more than a community one.
    drivers:
      - title: "Poverty"
        text: >-
          Stunting tracks household poverty closely, and Muslims are
          over-represented among the poor and the urban informal workforce
          {{cite:sachar-2006}}.
      - title: "Maternal health"
        text: >-
          An undernourished, anaemic mother bears a child who starts growth
          behind, and these conditions run high in poorer homes {{cite:nfhs5-2021}}.
      - title: "Diet quality"
        text: >-
          Tight budgets mean less diverse, protein-poor diets in the first two
          years, exactly when stunting sets in {{cite:nfhs5-2021}}.
    levers:
      - title: "The first 1,000 days"
        text: >-
          Stunting is prevented from pregnancy to age two; the Anganwadi and ICDS
          nutrition system is the main public instrument.
      - title: "Maternal nutrition"
        text: >-
          Treating anaemia and undernutrition in mothers protects the child's
          early growth {{cite:nfhs5-2021}}.
      - title: "Reach poor urban Muslims"
        text: >-
          Target the dense, informal-work neighbourhoods where Muslim children
          and nutrition services are most mismatched {{cite:sachar-2006}}.
    # Tailored to nutrition: led by the Women & Child Development ministry's
    # Poshan/ICDS system rather than the health ministry, plus a dedicated
    # under-five nutrition NGO (Antara). Reused health orgs keep their verified
    # links; programme links are confirmed live.
    stakeholders:
      - name: "Ministry of Women and Child Development"
        url: "https://poshanabhiyaan.gov.in/"
        mission: >-
          The Union ministry that runs Poshan Abhiyaan and the Anganwadi and ICDS
          system, India's main effort to cut stunting and undernutrition in young
          children, pregnant women and mothers.
      - name: "National Health Mission"
        url: "https://nhm.gov.in/index1.php?lang=1&level=1&sublinkid=794&lid=168"
        mission: >-
          The Government of India's flagship health programme, covering maternal,
          newborn and child health services across rural and urban India.
      - name: "Aga Khan Health Services, India"
        url: "https://the.akdn/en/where-we-work/south-asia/india/health-india"
        mission: >-
          The Aga Khan network's Indian health arm, whose child-health work
          includes infant-feeding and nutrition programmes. Founded by the Ismaili
          community, it serves all communities.
      - name: "The Antara Foundation"
        url: "https://antarafoundation.org/what-we-do/"
        mission: >-
          An NGO that strengthens India's frontline nutrition system, supporting
          Anganwadi and ASHA workers to improve maternal and under-five nutrition.
      - name: "Doctors For You"
        url: "https://doctorsforyou.org/public-health/rural-maternal-health-care-bihar.php"
        donate_url: "https://pages.razorpay.com/pl_I8hBrG9gTuRV40/view"
        credibility:
          label: "GiveIndia vetted"
          url: "https://give.do/ngos/doctors-for-you"
        mission: >-
          A humanitarian health NGO whose work includes treatment of severe acute
          malnutrition in children, alongside rural maternal and child health.
      - name: "SEWA Rural"
        url: "https://sewarural.org/hospital-services/"
        donate_url: "https://sewarural.org/donate-now/"
        credibility:
          label: "Credibility Alliance accredited"
          url: "https://sewarural.org/awards-recognitions/"
        mission: >-
          A voluntary organisation in tribal south Gujarat whose hospital and
          community programmes deliver maternal, newborn and child nutrition care.
      - name: "UNICEF India"
        url: "https://www.unicef.org/india/what-we-do"
        mission: >-
          The UN Children's Fund's India office, which works with states on child
          nutrition, survival and immunisation.

  # ----- Institutional delivery (NFHS). higher is better. Muslims BEHIND. -----
  inst-delivery:
    bottom_line: >-
      Muslim institutional deliveries have surged from under a third of births in
      1998 to 84.3% in 2019-21, one of the fastest gains on the dashboard. Hindus
      are at 89.5% and the national average 88.6%, so a gap remains, but most
      Muslim births now happen in a hospital or clinic rather than at home.
    how_to_read: >-
      The chart tracks the share of births in a health facility for each
      community across four National Family Health Surveys from 1998 to 2019-21;
      rising is better, and every line climbs steeply. The distance between
      Muslims and the better-served communities is the point, so the vertical
      axis does not start at zero.
    why_it_matters: >-
      A trained attendant and emergency care at birth are the single biggest
      protection against a mother or newborn dying. The shift from home to
      facility birth is the main reason maternal and newborn deaths have fallen
      so fast.
    status_note: >-
      The gap with Hindus widened during the mid-2000s, as better-off communities
      scaled up first, then began closing again after 2015 as cash incentives
      like Janani Suraksha Yojana reached further.
    drivers:
      - title: "Access"
        text: >-
          Fewer and more crowded facilities in poor and Muslim-concentrated
          pockets leave some births still at home {{cite:sachar-2006}}.
      - title: "Cost"
        text: >-
          The indirect costs of reaching and staying at a facility weigh most on
          poorer households {{cite:nfhs5-2021}}.
      - title: "Awareness and trust"
        text: >-
          Late or no antenatal contact, and unease with unfamiliar institutions,
          delay the move to a facility birth {{cite:nfhs5-2021}}.
    levers:
      - title: "Cash incentives"
        text: >-
          Janani Suraksha Yojana pays poorer mothers to deliver in a facility and
          drove much of the catch-up {{cite:nfhs5-2021}}.
      - title: "Local facilities"
        text: >-
          More and better-staffed centres in under-served Muslim areas close the
          remaining gap {{cite:sachar-2006}}.
      - title: "Antenatal contact"
        text: >-
          Early, regular check-ups are the bridge that turns into a facility birth
          {{cite:nfhs5-2021}}.
    stakeholders_from: imr

  # ----- Women's anaemia (NFHS). lower is better. Muslims marginally AHEAD. -----
  women-anemia:
    bottom_line: >-
      More than half of Muslim women aged 15 to 49, 55.6%, were anaemic in
      2019-21, marginally better than Hindu women at 57.4% and the national
      57.0%. The small Muslim edge is real and long-standing, but the headline is
      grim for everyone: anaemia is extremely common across all communities and
      has risen since the last survey.
    how_to_read: >-
      The chart tracks the share of women who are anaemic across four National
      Family Health Surveys; lower is better, but notice how little the lines
      separate and how most tick upward after 2015. The Muslim line sits just
      below the Hindu one throughout.
    why_it_matters: >-
      Anaemia saps energy and learning, raises the risk of death in childbirth,
      and passes low iron to the next child. At over half of all women, it is one
      of India's largest and most stubborn public-health failures.
    status_note: >-
      The Muslim advantage is small and, like every community's, moving the wrong
      way: anaemia rose between 2015 and 2019-21 despite a national supplementation
      programme.
    drivers:
      - title: "Diet"
        text: >-
          The main reason Muslim women fare slightly better is more frequent
          iron-rich non-vegetarian food, which the National Family Health Survey
          records as higher among Muslims {{cite:nfhs5-2021}}.
      - title: "A small edge on a huge problem"
        text: >-
          The gap between communities is tiny next to the gap between India and
          the rest of the world: cereal-heavy diets, early and frequent
          childbearing and poor iron absorption keep every group above half
          {{cite:nfhs5-2021}}.
    levers:
      - title: "Iron and folic acid"
        text: >-
          Universal supplementation through the Anaemia Mukt Bharat programme is
          the main instrument, though uptake and absorption stay weak.
      - title: "Dietary diversity"
        text: >-
          More iron-rich food, with vitamin C to absorb it, helps every community
          rather than one.
      - title: "Spaced pregnancies"
        text: >-
          Fewer and better-spaced births let a woman's iron stores recover.
    stakeholders_from: imr

  # ----- Hospital out-of-pocket spend (NSS health). descriptive (lighter). -----
  hospital-oop-spend:
    bottom_line: >-
      When a Muslim household has someone admitted to hospital, it pays about
      INR 30,104 from its own pocket, against INR 34,323 in a Hindu household. A
      lower bill is not good news here: it mostly reflects greater reliance on
      cheaper government hospitals, which in turn tracks lower incomes, rather
      than cheaper or better care.
    how_to_read: >-
      The chart compares out-of-pocket spending per hospital admission across
      communities for 2017 and 2025; childbirth is excluded, and lower is not
      automatically better. The Urban vs rural tab shows costs are higher in
      towns, where private hospitals dominate.
    why_it_matters: >-
      A single hospital admission is one of the commonest ways an Indian family
      slides into debt or poverty. What a household pays, and whether it can lean
      on a public hospital, says a lot about both its income and its exposure to a
      medical shock.
    status_note: >-
      The gap has widened in rupee terms as all costs rose, consistent with Muslim
      households staying more dependent on the public system as private care grew
      dearer.

  # ===================================================================
  # PHASE 2 - BATCH 2: Employment + Income (new verified rosters)
  # ===================================================================

  # ----- Labour-force participation (EUS+PLFS). higher is better. Muslims BEHIND (female-driven). -----
  lfpr-15plus:
    bottom_line: >-
      About 55% of Muslims aged 15 and over were working or looking for work in
      2023, against 61% of Hindus, but the whole of that gap is among women.
      Muslim men take part at slightly higher rates than Hindu men; Muslim women,
      at 36%, sit far below Hindu women at 49%, and that single gap pulls the
      community total down.
    how_to_read: >-
      The chart tracks the share of adults in the labour force across two decades,
      from the older Employment surveys to the newer PLFS; the dashed break at
      2017 marks the change of survey, so do not read the step there as a real
      fall. The By sex tab is the one to open here: it shows the gap is almost
      entirely about women. Working vs looking separates the employed from those
      still searching, and Urban vs rural splits the rate by place.
    why_it_matters: >-
      How many adults work or seek work sets the ceiling on a community's income.
      A large pool of working-age people outside the labour force, most of them
      women, means fewer earners in each household and less to go around.
    status_note: >-
      The headline gap has narrowed over twenty years, but largely because
      participation drifted down for everyone; the low rate among Muslim women is
      the part that has barely moved.
    drivers:
      - title: "Women's participation"
        text: >-
          The gap is almost entirely a female one: Muslim women join the workforce
          at very low rates, for reasons that mix social norms, safety, childcare
          and a shortage of suitable local work {{cite:sachar-2006}}.
      - title: "Self-employment"
        text: >-
          Muslim men cluster in self-employment and family enterprise rather than
          wage work, which the surveys count but which offers thinner, less secure
          earnings {{cite:sachar-2006}}.
      - title: "Education"
        text: >-
          Lower schooling keeps many out of the formal jobs that draw people into
          the labour force in the first place {{cite:sachar-2006}}.
    levers:
      - title: "Enable women's work"
        text: >-
          Safe transport, childcare and nearby job creation do the most to lift
          the rate, since the female shortfall is where the gap lives.
      - title: "Skilling"
        text: >-
          Vocational training through schemes like PM VIKAS and PMKVY widens the
          path into wage work.
      - title: "Credit for enterprise"
        text: >-
          Affordable credit strengthens the self-employment many Muslim households
          already depend on.
    stakeholders:
      - name: "Ministry of Skill Development and Entrepreneurship"
        url: "https://www.msde.gov.in/offerings/schemes-and-services/details/pradhan-mantri-kaushal-vikas-yojana-4-0-pmkvy-4-0-2021"
        mission: >-
          India's nodal skilling ministry, whose Pradhan Mantri Kaushal Vikas
          Yojana gives young people free short-term skill training and
          certification to improve their employment prospects.
      - name: "Ministry of Minority Affairs (PM VIKAS)"
        url: "https://pmvikas.minorityaffairs.gov.in/"
        mission: >-
          The Ministry's converged minority skilling and entrepreneurship scheme,
          PM VIKAS, which trains and supports young people from the notified
          minorities for jobs and self-employment.
      - name: "National Skill Development Corporation"
        url: "https://nsdcindia.org/seekhoaurkamao"
        mission: >-
          The public-private corporation under the skilling ministry that funds
          and runs national skill programmes, including minority skilling
          delivery such as Seekho aur Kamao.
      - name: "Association of Muslim Professionals"
        url: "https://www.ampindia.org/employment_assistance_cell"
        donate_url: "https://www.ampindia.org/make_a_donation"
        mission: >-
          A volunteer professionals' body whose Employment Assistance Cell runs
          job fairs and drives that connect unemployed youth to corporate jobs.
      - name: "Pratham"
        url: "https://www.pratham.org/programs/education/vocational-training/"
        donate_url: "https://pratham.org/donation/"
        credibility:
          label: "GiveIndia vetted"
          url: "https://give.do/discover/17G3/pratham-education-foundation/"
        mission: >-
          One of India's largest education NGOs, whose vocational-training
          programme equips disadvantaged youth aged 18 to 35 with employable
          skills and links them to jobs.
      - name: "Magic Bus India Foundation"
        url: "https://www.magicbus.org/campaign/youth-skilling-programme.php"
        donate_url: "https://www.magicbus.org/donate-for-livelihood/"
        credibility:
          label: "GiveIndia vetted"
          url: "https://give.do/discover/U8Q/magic-bus-india-foundation/"
        mission: >-
          An NGO that runs a life-skills and employment-linked programme training
          underserved youth and placing them in entry-level jobs.

  # ----- Unemployment rate (EUS+PLFS). lower is better, but low can mean distress. ~AT PARITY. -----
  unemployment-rate-15plus:
    bottom_line: >-
      At 3.2%, measured Muslim unemployment in 2023 was barely above the Hindu
      rate of 3.1%, and well below its late-2010s peak. But a low unemployment
      rate is not the good news it looks like: people who cannot afford to sit
      idle take whatever informal work they can find, so distress, not comfort,
      often keeps the number down.
    how_to_read: >-
      The chart tracks the share of the labour force that is unemployed; the 2017
      dashed break marks the switch to the PLFS survey. Read it alongside the
      salaried-jobs and consumption cards, because a low rate here sits next to
      low-paid, insecure work. The By sex and Urban vs rural tabs show where
      joblessness concentrates: among the educated, the urban and the young.
    why_it_matters: >-
      Open unemployment counts only those who can hold out for a job. For a
      poorer community it understates the real problem, which is not idleness but
      the scarcity of secure, decently paid work.
    status_note: >-
      Muslim unemployment ran clearly above the Hindu rate from 2017 to 2019 and
      has since converged; the gap that matters now is in the quality of work, not
      the headline rate.
    drivers:
      - title: "Educated joblessness"
        text: >-
          As in every community, unemployment is highest among the better-educated
          young, who can wait for a suitable job; for Muslims this overlaps with
          the urban salaried gap {{cite:sachar-2006}}.
      - title: "No cushion"
        text: >-
          Poorer households cannot afford open unemployment, so members take
          informal, casual work, which holds the measured rate down
          {{cite:sachar-2006}}.
      - title: "Discrimination"
        text: >-
          Audit studies that sent matched job applications found CVs with Muslim
          names called back less often, one barrier to the formal jobs people
          queue for {{cite:thorat-attewell-2007}}.
    levers:
      - title: "Better jobs, not just any jobs"
        text: >-
          The goal is secure, formal employment, not a lower headline rate.
      - title: "Skilling and placement"
        text: >-
          Training paired with active placement links job-seekers to formal work.
      - title: "Fair hiring"
        text: >-
          Anonymised or audited recruitment counters the name-based bias the
          studies record {{cite:thorat-attewell-2007}}.
    stakeholders_from: lfpr-15plus

  # ----- Regular-salaried share (EUS+PLFS). higher is better. Muslims BEHIND (urban-starkest). -----
  salaried-share:
    bottom_line: >-
      Just 18% of Muslim workers hold a regular salaried job, against 22% of
      Hindus; most Muslims work for themselves or as casual labour. The gap is
      starkest in cities, where salaried work is common: there, about a third of
      Muslim workers are salaried, against half of Hindus.
    how_to_read: >-
      The chart tracks the share of workers in regular salaried jobs over two
      decades, with the 2017 dashed break marking the move to the PLFS survey.
      The Urban vs rural tab carries the real story: the salaried gap is small in
      villages but very wide in towns. What it pays compares earnings inside those
      salaried jobs, and By sex splits the rate by gender.
    why_it_matters: >-
      A regular salaried job means a predictable wage, and often paid leave,
      provident fund and some security. The shortage of such jobs is the core of
      the Muslim economic disadvantage: not that Muslims do not work, but that
      their work is more often informal, self-run and insecure.
    status_note: >-
      The salaried share has risen for Muslims over twenty years, but the gap with
      Hindus has held, and it stays widest exactly where formal jobs are most
      available, in the cities.
    drivers:
      - title: "Education"
        text: >-
          Regular salaried jobs increasingly need credentials that fewer Muslims
          hold, the labour-market end of the schooling gap {{cite:sachar-2006}}.
      - title: "Hiring discrimination"
        text: >-
          Resume-audit studies found applicants with Muslim names called back
          significantly less often than identical Hindu applicants
          {{cite:thorat-attewell-2007}}.
      - title: "Self-employment"
        text: >-
          A long tilt toward family enterprise and trade, partly a response to
          closed doors, keeps many Muslims out of the wage sector
          {{cite:sachar-2006}}.
      - title: "Little public-sector work"
        text: >-
          Muslims are sharply under-represented in government jobs, which make up
          a large share of all salaried work {{cite:sachar-2006}}.
    levers:
      - title: "Credentials"
        text: >-
          Closing the education and skilling gap is the precondition for more
          salaried work {{cite:sachar-2006}}.
      - title: "Fair recruitment"
        text: >-
          Audited, name-blind hiring counters the documented bias
          {{cite:thorat-attewell-2007}}.
      - title: "Public-sector access"
        text: >-
          Transparent recruitment and outreach widen Muslim entry into government
          jobs {{cite:post-sachar-2014}}.
      - title: "Formalise enterprise"
        text: >-
          Credit and market links can turn informal self-employment into steadier,
          registered businesses.
    stakeholders_from: lfpr-15plus

  # ----- Monthly per-capita consumption (HCES). higher is better. Muslims BEHIND ~10%. -----
  mpce:
    bottom_line: >-
      An average Muslim spent INR 4,455 a month in 2023, about a tenth less than
      the INR 4,974 a Hindu spent and below the national INR 4,958. Spending is
      the standard yardstick of living standards in India, used because no
      reliable income figure by religion exists, and on it Muslims sit at the
      lower end.
    how_to_read: >-
      The chart compares average monthly spending per person across communities;
      higher means a higher material standard of living. The By state tab shows
      how far this swings across India, Top spending fifth looks at the better-off
      slice of each community, and Urban vs rural splits town from village.
      Spending gaps are narrower than wealth gaps, because even poorer households
      must spend to live.
    why_it_matters: >-
      Monthly spending is the closest thing to a living-standards thermometer
      India has by religion. It rolls food, rent, fuel, schooling and health into
      one figure, and a persistent gap means a persistently lower standard of
      everyday life.
    status_note: >-
      The Muslim shortfall in spending, around a tenth, is smaller than the gap in
      wealth, the deeper divide; consumption gaps compress because everyone must
      eat and pay rent.
    drivers:
      - title: "Lower earnings"
        text: >-
          The consumption gap flows from the jobs gap: more informal, self-run and
          casual work means lower and less certain household income
          {{cite:sachar-2006}}.
      - title: "More mouths"
        text: >-
          A larger average household spreads the same earnings across more people,
          lowering spending per head {{cite:sachar-2006}}.
      - title: "Urban poverty"
        text: >-
          Muslims are concentrated in towns, but in their poorer, informal-economy
          parts, where costs are high and wages low {{cite:sachar-2006}}.
    levers:
      - title: "Raise earnings"
        text: >-
          The durable lever is better, more formal work, the same fix as the jobs
          cards.
      - title: "Targeted welfare"
        text: >-
          Food, fuel and cash support reach poorer Muslim households through
          universal rather than separate schemes {{cite:post-sachar-2014}}.
      - title: "Education"
        text: >-
          Schooling is the slow lever that lifts the next generation's earnings
          and spending.
    stakeholders:
      - name: "National Minorities Development and Finance Corporation"
        url: "https://nmdfc.org/"
        mission: >-
          A statutory corporation under the Ministry of Minority Affairs that
          provides concessional credit for self-employment and skills to the
          notified minority communities.
      - name: "Ministry of Minority Affairs"
        url: "https://www.minorityaffairs.gov.in/"
        mission: >-
          The Union ministry for the welfare and economic development of India's
          notified minorities, running scholarship, skilling and livelihood
          schemes.
      - name: "Sahulat Microfinance Society"
        url: "https://www.sahulat.org/category/interest-free-microfinance-through-cooperatives/"
        donate_url: "https://www.sahulat.org/category/donate-now/"
        mission: >-
          A national NGO that promotes interest-free microfinance for marginalised
          communities through a network of member-owned credit cooperatives.
      - name: "SEWA Bharat"
        url: "https://sewabharat.org/what-we-do/financial-inclusion/"
        donate_url: "https://pages.razorpay.com/sewabharat"
        credibility:
          label: "GiveIndia vetted"
          url: "https://give.do/discover/18CI/sewa-bharat-all-india-federation-of-self-employed-womens-association/"
        mission: >-
          A federation that builds financial independence for informal-sector
          women through credit cooperatives, banking access and financial
          literacy.
      - name: "Rang De"
        url: "https://rangde.in/blog/what-is-social-investing"
        mission: >-
          An RBI-regulated peer-to-peer social-investing platform that channels
          low-cost credit to low-income rural entrepreneurs, most of them women.

  # ----- Household net worth (AIDIS). higher is better. Muslims BEHIND ~20%. -----
  household-net-worth:
    bottom_line: >-
      The average Muslim household was worth about INR 15.0 lakh in 2018, what it
      owns minus what it owes, against INR 18.8 lakh for a Hindu household. The
      wealth gap, about a fifth, runs deeper than the gap in monthly spending,
      because wealth is the slow build-up of land, property and savings that
      disadvantage compounds over generations.
    how_to_read: >-
      The chart compares average household net worth, assets minus debts, for 2012
      and 2018. Wealth is a stock, not a flow, so it moves slowly and gaps are
      wide. The Borrowing sources tab shows where each community turns for credit,
      banks or moneylenders, and Urban vs rural splits the two.
    why_it_matters: >-
      Wealth is the cushion that income is not: it pays for a medical emergency, a
      business or a child's education without borrowing at ruinous rates. A
      thinner cushion leaves a household one shock away from crisis, with less to
      pass on.
    status_note: >-
      Muslim household wealth grew faster than Hindu wealth between 2012 and 2018,
      closing the ratio a little, but the absolute gap remains around a fifth.
    drivers:
      - title: "Lower income"
        text: >-
          Less is earned, so less can be saved or invested; the wealth gap starts
          as the income gap {{cite:sachar-2006}}.
      - title: "Less land and property"
        text: >-
          Muslims own less agricultural land and are more often urban tenants than
          home-owners, the assets that make up most Indian wealth
          {{cite:sachar-2006}}.
      - title: "Credit exclusion"
        text: >-
          Lower access to bank credit, including the documented marking of
          Muslim-concentrated areas as negative for lending, pushes households to
          costlier informal borrowing that erodes wealth {{cite:sachar-2006}}.
    levers:
      - title: "Formal credit"
        text: >-
          Bringing Muslim-concentrated areas fully into priority-sector bank
          lending lowers the cost of building assets {{cite:post-sachar-2014}}.
      - title: "Interest-free and micro-finance"
        text: >-
          Cooperative and interest-free finance reaches households the banks miss.
      - title: "Asset programmes"
        text: >-
          Housing and enterprise schemes that build durable assets close the stock
          gap faster than income alone.
    stakeholders_from: mpce

  # ===================================================================
  # PHASE 2 - BATCH 3: Housing & basic amenities (Muslims AT/ABOVE - keep the inversion)
  # ===================================================================

  # ----- Toilet access (NFHS). higher is better. Muslims AHEAD. -----
  improved-sanitation:
    bottom_line: >-
      Nine in ten Muslim households had a toilet in 2020, at 90.3% the highest of
      any major community and almost ten points above Hindus at 80.7%. This is
      one of a cluster of housing measures, toilets, water and electricity, where
      Muslims sit at or above the national level, a pattern that runs against the
      gaps on income and education.
    how_to_read: >-
      The chart compares the share of households with a toilet across communities
      for 2019-21; higher is better. The Urban vs rural tab matters here: access
      is higher in towns for every community, and part of the Muslim lead comes
      from being a more urban community.
    why_it_matters: >-
      A household toilet is one of the strongest protections a child has: where
      neighbourhoods stop open defecation, fewer infants die and fewer children
      are stunted. This is the same sanitation advantage that helps explain why
      Muslim infants survive at higher rates.
    status_note: >-
      The Muslim lead on toilets holds across the country and connects directly to
      the community's better infant survival, where local sanitation is the
      best-evidenced cause.
    drivers:
      - title: "Urban living"
        text: >-
          Muslims are more urban than average, and towns have far higher toilet
          coverage than villages {{cite:sachar-2006}}.
      - title: "Less open defecation"
        text: >-
          Muslim neighbourhoods practise less open defecation than Hindu ones at
          the same income, a difference researchers tie to both norms and density
          {{cite:geruso-spears-2018}}.
      - title: "Compact settlements"
        text: >-
          Dense, often walled urban settlement makes a household latrine both more
          usual and more necessary.
    levers:
      - title: "Universal coverage"
        text: >-
          Swachh Bharat has pushed toilet access up for everyone; the unfinished
          task is the poorest rural households of every community.
      - title: "Use, not just build"
        text: >-
          The lasting gain is in sustained use and maintenance, not just
          construction.
      - title: "Water to match"
        text: >-
          A toilet needs water to work, which links this directly to the
          drinking-water push.
    stakeholders:
      - name: "Swachh Bharat Mission (Grameen)"
        url: "https://swachhbharatmission.ddws.gov.in/"
        mission: >-
          The national rural sanitation programme, under the Ministry of Jal
          Shakti, that built over ten crore household toilets to make villages
          free of open defecation.
      - name: "Jal Jeevan Mission"
        url: "https://jaljeevanmission.gov.in/"
        mission: >-
          The Ministry of Jal Shakti mission to provide a safe piped drinking
          water connection to every rural household, with source sustainability
          and community management.
      - name: "Pradhan Mantri Awas Yojana (Gramin)"
        url: "https://pmayg.dord.gov.in/netiayHome/Home.aspx"
        mission: >-
          The Ministry of Rural Development scheme that helps houseless families
          and those in kutcha homes build a pucca house with basic amenities.
      - name: "Aga Khan Agency for Habitat, India"
        url: "https://www.akahindia.org/"
        mission: >-
          The Aga Khan network's habitat agency, building water security,
          sanitation, low-cost housing and disaster resilience in Gujarat,
          Maharashtra and Telangana. Founded by the Ismaili community, it serves
          all communities.
      - name: "Human Welfare Foundation"
        url: "https://www.hwfindia.org/category/community/"
        donate_url: "https://www.hwfindia.org/donate/"
        mission: >-
          A development NGO whose community work includes drinking-water and
          shelter projects for deprived families in disadvantaged, largely
          minority areas.
      - name: "WaterAid India"
        url: "https://www.wateraid.org/in"
        donate_url: "https://www.wateraid.org/in/donate/clean-water"
        credibility:
          label: "80G + FCRA"
          url: "https://give.do/discover/3VG/jal-seva-charitable-foundation-wateraid-india/"
        mission: >-
          A water and sanitation NGO working since 1986 across about 1,200
          villages in ten states to make clean water, decent toilets and good
          hygiene reach the poorest.
      - name: "Habitat for Humanity India"
        url: "https://habitatindia.org/"
        donate_url: "https://habitatindia.org/donate/"
        credibility:
          label: "80G + FCRA"
          url: "https://habitatindia.org/donate/"
        mission: >-
          A housing NGO that provides decent, affordable homes and sanitation to
          low-income and marginalised families and helps disaster-hit families
          rebuild.
      - name: "Sulabh International"
        url: "https://www.sulabhinternational.org/"
        mission: >-
          India's pioneering sanitation movement, which has built over sixteen
          lakh household toilets and ten thousand public toilet complexes and works
          to rehabilitate manual scavengers.

  # ----- Drinking water on premises (NSS). higher is better. Muslims AHEAD. -----
  improved-water-premises:
    bottom_line: >-
      About 69% of Muslim households had drinking water on their own premises in
      2018, so no one had to walk to fetch it, against 63% of Hindu households.
      Like toilets, this is a measure where Muslims sit a little above the
      national level, helped by being a more urban community.
    how_to_read: >-
      The chart compares the share of households with an improved water source on
      their own premises across communities for 2018; higher is better, because it
      means no daily walk to fetch water. The Urban vs rural tab splits the two.
    why_it_matters: >-
      Water on the premises saves hours of fetching, almost always women's and
      girls' time, and cuts the contamination that comes with carrying and storing
      water. It feeds straight into health, school attendance and the time women
      have for paid work.
    status_note: >-
      The Muslim edge on water, like sanitation, owes much to urban concentration,
      and it sits within a wider picture where the basic-amenities story runs
      opposite to the income story.
    drivers:
      - title: "Urban living"
        text: >-
          Piped, on-premises water is far more common in towns, where Muslims are
          over-represented {{cite:sachar-2006}}.
      - title: "Dense settlement"
        text: >-
          Compact urban neighbourhoods are cheaper to connect to a piped network
          than scattered rural homes.
      - title: "Public schemes"
        text: >-
          Expanding piped-water schemes have reached urban and, more recently,
          rural homes across communities.
    levers:
      - title: "Jal Jeevan Mission"
        text: >-
          The rural piped-water push is the main lever to extend on-premises water
          to the households still without it.
      - title: "Urban equity"
        text: >-
          The remaining urban gaps are in informal settlements, which need
          targeted connections.
      - title: "Source sustainability"
        text: >-
          A tap helps only if the source lasts, the harder long-term task.
    stakeholders_from: improved-sanitation

  # ----- Pucca housing (NSS). higher is better. Muslims AT PARITY. -----
  pucca-house:
    bottom_line: >-
      About 84% of Muslim households lived in a pucca, permanent-material home in
      2018, essentially the same as Hindus at 83%. On the basic quality of the
      roof over their heads the two communities are level, another amenity where
      the usual gap does not appear.
    how_to_read: >-
      The chart compares the share of households in a pucca (permanent-material)
      home across communities for 2018; higher is better. The Electricity tab
      carries a closely related amenity, and Urban vs rural splits the rate by
      place, where pucca housing is near-universal in towns.
    why_it_matters: >-
      A pucca home of brick or concrete withstands monsoon, heat and fire far
      better than a kutcha one of mud or thatch, and is the base for everything
      from health to a child's place to study. It is the most basic marker of
      housing security.
    status_note: >-
      On housing structure Muslims and Hindus are level, and both sit near the
      national average; the gaps in this cluster are between town and village, not
      between communities.
    drivers:
      - title: "A shared floor"
        text: >-
          Pucca housing has become near-universal in towns for every community, so
          urban Muslims and Hindus look alike {{cite:sachar-2006}}.
      - title: "Housing schemes"
        text: >-
          Decades of rural and urban housing programmes have lifted
          permanent-material homes across the board.
      - title: "Self-build first"
        text: >-
          Households of all communities invest first in a solid house, often the
          single largest asset they ever build.
    levers:
      - title: "Reach the last kutcha homes"
        text: >-
          The remaining gap is the poorest rural households of every community, the
          target of the housing schemes.
      - title: "Quality, not just walls"
        text: >-
          A pucca label can still hide crowding and poor ventilation worth
          improving.
      - title: "Tenure security"
        text: >-
          Secure land title is what lets the urban poor invest in a permanent home.
    stakeholders_from: improved-sanitation

  # ===================================================================
  # PHASE 2 - BATCH 4: Representation + Justice (sensitive; factual, non-partisan)
  # ===================================================================

  # ----- Lok Sabha Muslim MPs (ECI/PRS). under-representation. Muslim-only series. -----
  ls-share:
    bottom_line: >-
      Muslims hold 24 of the 543 seats in the Lok Sabha elected in 2024, about
      4.4%, against a 14.2% share of the population. If seats matched population
      there would be roughly 77 Muslim MPs. Representation in Parliament peaked in
      the 1980s and has drifted down since, even as the population share rose.
    how_to_read: >-
      The chart tracks the number, and share, of Muslim members of the Lok Sabha
      at each general election since 1952, against the population-parity mark of
      77 seats. This card counts seats won, not votes cast or candidates fielded,
      so it measures outcomes, not effort.
    why_it_matters: >-
      Who sits in the legislature shapes which concerns reach the floor, which
      laws pass and how budgets are shared. Persistent under-representation of a
      seventh of the country means a large community's voice is thinner in the
      rooms where decisions are made.
    drivers:
      - title: "Dispersed population"
        text: >-
          Muslims are a minority almost everywhere and a majority in very few
          constituencies, so a first-past-the-post system rarely returns a Muslim
          member {{cite:misra-2007}}.
      - title: "Fewer candidates"
        text: >-
          Parties have fielded steadily fewer Muslim candidates over recent
          decades, narrowing the pool that can win {{cite:india-forum-rep}}.
      - title: "Polarisation"
        text: >-
          Where elections turn on community lines, Muslim candidates draw fewer
          cross-community votes, lowering their odds in mixed seats
          {{cite:india-forum-rep}}.
    levers:
      - title: "Candidate selection"
        text: >-
          The most direct lever sits with the parties, in how many Muslim
          candidates they field in winnable seats.
      - title: "Voter participation"
        text: >-
          Complete electoral rolls and turnout efforts, the Election Commission's
          remit, ensure the community's votes are fully counted.
      - title: "Local office"
        text: >-
          Representation in panchayats and municipalities builds the pipeline of
          candidates for higher office.
    stakeholders:
      - name: "Election Commission of India"
        url: "https://ecisveep.nic.in/division/about-us/"
        mission: >-
          The constitutional body that conducts free and fair elections, whose
          SVEEP programme runs voter education and turnout work to deepen
          participation.
      - name: "National Commission for Minorities"
        url: "https://www.ncm.nic.in/"
        mission: >-
          A statutory body under the National Commission for Minorities Act, 1992
          that monitors the constitutional and legal safeguards of the notified
          minority communities.
      - name: "Association for Democratic Reforms"
        url: "https://adrindia.org/about-adr/who-we-are"
        donate_url: "https://adrindia.org/content/adr-donation-campaign"
        credibility:
          label: "GiveIndia vetted"
          url: "https://give.do/discover/VZR/association-for-democratic-reforms/"
        mission: >-
          A non-partisan body that publishes candidates' criminal, financial and
          educational records from their election affidavits to strengthen
          electoral transparency.
      - name: "Lokniti, Centre for the Study of Developing Societies"
        url: "https://www.lokniti.org/about-us"
        mission: >-
          A non-partisan academic programme that runs India's National Election
          Studies and survey research on democracy, including community patterns
          in voting and representation.

  # ----- State-assembly Muslim MLAs (ECI/PRS). under-representation. Muslim-only series. -----
  mla-share:
    bottom_line: >-
      Muslims hold about 6% of seats across India's state legislative assemblies,
      against a 14.2% population share. The shortfall is narrower than in the Lok
      Sabha but still wide, and it varies sharply from state to state, which the
      By assembly tab lays out.
    how_to_read: >-
      The chart shows the Muslim share of seats in each state and union-territory
      assembly at its most recent election, with a national aggregate of about 6%.
      The By assembly tab ranks the states and pairs each one's seat share against
      its Muslim population share, so you can see where representation tracks
      numbers and where it falls far short.
    why_it_matters: >-
      State assemblies decide on policing, land, health and schooling, the
      services that touch daily life most directly. Thin representation in them
      means fewer voices on exactly the local decisions that shape a community's
      living conditions.
    drivers:
      - title: "Geography by state"
        text: >-
          Representation roughly tracks where Muslims are concentrated enough to
          swing a seat; states with a dispersed Muslim population elect almost none
          {{cite:misra-2007}}.
      - title: "Candidate selection"
        text: >-
          As in Parliament, party ticket decisions set the ceiling on how many
          Muslims can win an assembly seat {{cite:india-forum-rep}}.
      - title: "Reserved seats"
        text: >-
          Seats reserved for Scheduled Castes and Tribes, which Muslims cannot
          contest as such, remove some constituencies from the open pool
          {{cite:misra-2007}}.
    levers:
      - title: "Party tickets"
        text: >-
          The direct lever is how many Muslim candidates parties field in winnable
          assembly seats.
      - title: "Local pipeline"
        text: >-
          Strong representation in local bodies feeds candidates upward into
          assembly contests.
      - title: "Inclusive rolls"
        text: >-
          Complete electoral rolls and turnout work ensure no eligible voter is
          left uncounted.
    stakeholders_from: ls-share

  # ----- Incarceration rate (NCRB). lower is better. Muslims BEHIND (over-incarcerated). -----
  prison-rate-per-100k:
    bottom_line: >-
      Muslims are imprisoned at about 63 per 100,000 of their population, against
      40 for Hindus and 45 nationally, so a Muslim is around one and a half times
      as likely to be in jail as the average Indian. Most of this is not about
      conviction: a large majority of all prisoners are undertrials, awaiting
      trial rather than found guilty, and Muslims are over-represented among them.
    how_to_read: >-
      The chart compares the incarceration rate, prisoners per 100,000 of each
      community's own population, so it is not distorted by community size. The
      Undertrials tab is the one to read closely: it shows how much of the gap is
      people held awaiting trial, not convicts. By state shows how sharply this
      varies across India.
    why_it_matters: >-
      Who is in prison, and who waits there untried, is one of the clearest tests
      of equal justice. Over-incarceration, especially of the unconvicted, falls
      hardest on poor families who lose an earner and cannot afford bail or a
      lawyer.
    status_note: >-
      The gap is driven less by convictions than by pre-trial detention: most
      Muslim prisoners are undertrials, where poverty, the cost of bail and slow
      courts weigh heaviest.
    drivers:
      - title: "Undertrials"
        text: >-
          Most prisoners of every community are undertrials, not convicts, and
          Muslims are over-represented among them, so the gap is largely about who
          is held before trial {{cite:india-justice-report}}.
      - title: "Poverty and bail"
        text: >-
          Those who cannot afford a bail bond or a lawyer stay inside; the
          community's higher poverty translates into longer pre-trial detention
          {{cite:sachar-2006}}.
      - title: "Slow courts"
        text: >-
          Chronic case backlogs keep undertrials in jail for months or years,
          magnifying any disparity at the point of arrest {{cite:india-justice-report}}.
    levers:
      - title: "Bail reform"
        text: >-
          Easier, affordable bail and personal-bond release for the poor would cut
          undertrial numbers fastest {{cite:india-justice-report}}.
      - title: "Legal aid"
        text: >-
          Prompt, free legal representation, the National Legal Services
          Authority's mandate, shortens detention.
      - title: "Undertrial review"
        text: >-
          Regular review committees and faster trials clear the backlog of people
          held without conviction {{cite:india-justice-report}}.
    stakeholders:
      - name: "National Legal Services Authority"
        url: "https://nalsa.gov.in/about-nalsa/"
        mission: >-
          The statutory authority that provides free legal aid to weaker sections
          and runs Undertrial Review Committees and Lok Adalats to reduce pending
          cases and unnecessary detention.
      - name: "Commonwealth Human Rights Initiative"
        url: "https://www.humanrightsinitiative.org/content/prison-reforms.html"
        donate_url: "https://www.nowdonate.com/donate/commonwealth-human-rights-initiative"
        mission: >-
          An independent, non-partisan human-rights NGO whose prison-reform work
          targets unnecessary pre-trial detention and legal aid for prisoners.
      - name: "Project 39A, National Law University Delhi"
        url: "https://www.project39a.com/"
        mission: >-
          A university criminal-justice centre, named after Article 39A, working
          on legal aid, fair trial, sentencing and torture prevention.
      - name: "India Justice Report"
        url: "https://indiajusticereport.org/"
        mission: >-
          A periodic data initiative, produced by Tata Trusts with research
          partners, that ranks states on police, prisons, judiciary and legal aid,
          including undertrial and prison-demographic statistics.

  # ===================================================================
  # PHASE 2 - BATCH 5: Demographics (DESCRIPTIVE - lighter: no drivers/levers/stakeholders)
  # ===================================================================

  # ----- Muslim population share (Census). descriptive. Status suppressed. -----
  pop-share:
    no_status: true
    bottom_line: >-
      Muslims were 14.2% of India's population at the 2011 Census, about one in
      seven Indians and roughly 17 crore people. That count is now well over a
      decade old: the Pew Research Center estimated the Muslim share had reached
      about 15% by 2020 {{cite:pew-india-2021}}. It is still rising, but slowly,
      and not because growth is speeding up: Muslim fertility has fallen sharply,
      from 4.4 children per woman in 1992 to 2.6 by 2015, steadily narrowing the
      gap with other communities {{cite:pew-india-2021}}.
    how_to_read: >-
      The chart tracks the Muslim share of the population across the six censuses
      from 1961 to 2011, the last year with hard census data. The next count,
      Census 2027, is long delayed from the one due in 2021: its
      population-enumeration phase is set for early 2027, and it will be India's
      first digital and first caste-counted census since 1931, so a fresh official
      figure is still some way off {{cite:census-2027}}. The tabs open the detail:
      By state and By district show how unevenly Muslims are spread, Urban vs rural
      and By age show a younger, more urban profile, and Population growth shows how
      the decadal growth rate has fallen.
    why_it_matters: >-
      Population share is the denominator for everything else on this dashboard:
      it is what every gap on jobs, schooling or representation is measured
      against. A seventh of the country is large enough that how this group fares
      shapes India's own development.

  # ----- Urban share (Census). descriptive. Status kept (neutral). -----
  urban-share:
    bottom_line: >-
      Two in five Muslims, 39.9%, lived in towns and cities in 2011, well above
      the 31% national average and the 29% for Hindus. Muslims are one of India's
      most urban communities, a fact that shapes much of the rest of this
      dashboard, from their better housing amenities to their concentration in
      urban informal work.
    how_to_read: >-
      The chart compares how urban each community is across the 2001 and 2011
      censuses; this is a descriptive fact, not a good or bad outcome. The By
      state tab shows how much it varies, from highly urban Muslim populations in
      the south and west to more rural ones in the east.
    why_it_matters: >-
      Whether a community lives in towns or villages colours almost every other
      measure: urban families have better access to toilets, water and hospitals,
      but also face the insecure, informal labour markets and segregated
      neighbourhoods of the city. Muslim urban concentration is the thread running
      through both their amenity advantages and their job disadvantages.
    status_note: >-
      Muslims have been markedly more urban than Hindus in every recent census, a
      structural fact that helps explain the housing-amenity inversion elsewhere
      on this dashboard.

  # ----- Sex ratio (Census). descriptive. Status kept (neutral). -----
  sex-ratio:
    bottom_line: >-
      There were 951 Muslim women for every 1,000 Muslim men in 2011, a little
      higher than the 939 for Hindus and the 943 national average. Like the rest
      of India the Muslim population has fewer women than men, but its ratio has
      been slightly more balanced than the Hindu one and has improved since 2001.
    how_to_read: >-
      The chart tracks the number of females per 1,000 males across six censuses
      since 1961; a value below 1,000 means fewer women than men. Because the
      interesting range is narrow, the axis sits in an 800 to 1,050 band rather
      than starting at zero. The By state and Urban vs rural tabs show where the
      ratio is most and least balanced.
    why_it_matters: >-
      The sex ratio is a quiet signal of how a society values its girls and women,
      picking up the combined effect of sex selection, female mortality and
      migration. A ratio closer to balance is generally the healthier sign.
    status_note: >-
      The Muslim sex ratio has run slightly more balanced than the Hindu one
      across recent censuses and improved between 2001 and 2011, against the wider
      Indian pattern of too few women.

  # ===================================================================
  # PHASE 2 - BATCH 6: communal-incidents (MOST SENSITIVE; restrained + heavily caveated)
  # No drivers/levers by design: attributing causes of communal violence is too
  # charged and the official count too unreliable. All-India count, no community
  # split, so Status is suppressed. Non-partisan statutory stakeholders only.
  # ===================================================================
  communal-incidents-govt:
    no_status: true
    bottom_line: >-
      India's official tally of communal or religious rioting incidents was 272
      in 2023, down from a recent peak of 869 in 2016, though the count swings
      sharply from year to year, it was 857 in 2020. Read this number with care:
      it captures only incidents the police formally recorded under one narrow
      crime-records category, it is widely regarded as an undercount, and it is
      not broken down by which community was affected.
    how_to_read: >-
      The chart tracks the National Crime Records Bureau's annual count of
      communal and religious rioting incidents from 2015 to 2023; lower is better,
      but the line is only as complete as official recording. This is one specific
      NCRB sub-category, so it misses incidents logged under other heads or never
      registered, and unlike the rest of this dashboard it is not split by
      religion. The By state tab shows where recorded incidents cluster.
    why_it_matters: >-
      Communal violence falls hardest on minorities, and the threat of it shapes
      where Muslims feel safe to live, work and worship. An honest, complete count
      would be one of the most important measures on this dashboard; the distance
      between what is recorded here and what communities actually experience is
      itself part of the story.
    stakeholders:
      - name: "National Foundation for Communal Harmony"
        url: "https://nfch.nic.in/"
        mission: >-
          An autonomous body under the Home Ministry that promotes communal
          harmony and supports the rehabilitation and education of children
          orphaned in communal, caste or terrorist violence.
      - name: "National Human Rights Commission"
        url: "https://nhrc.nic.in/"
        mission: >-
          The statutory commission that inquires into human-rights violations,
          including in communal incidents, and recommends remedies and
          compensation.
      - name: "National Commission for Minorities"
        url: "https://www.ncm.nic.in/"
        mission: >-
          A statutory body under the National Commission for Minorities Act, 1992
          that monitors the constitutional and legal safeguards of the notified
          minority communities.
