# manifest/narratives.yaml
# -------------------------------------------------------------------------
# Per-metric narrative prose for the modal + /m/{id}/ landing pages, modelled
# on the sibling hawaiidashboard.org's consolidated narrative, plus a net-new
# "Key stakeholders" section. ONE body per CARDED metric, written to speak to
# ALL of that metric's modal tabs.
#
# Rendered by dashboard/build.py (_metric_narrative_html). Fields per metric:
#   bottom_line     - the TL;DR callout (always visible)
#   how_to_read     - chart + tabs reading guide (collapsible)
#   why_it_matters  - one or two sentences (always visible)
#   status_note     - hand-written sentence appended AFTER the auto-computed
#                     Status badge + figures (the badge/figures come from the
#                     data via _metric_status; do NOT restate the numbers here)
#   drivers         - "Potential drivers" (inside Deeper analysis)
#   levers          - "Key levers" (inside Deeper analysis)
#   stakeholders    - list of {name, url, mission}
#
# Prose is author-controlled trusted markup (inline <a>/<em> allowed, NOT
# escaped). Cite sources with {{cite:key}} tokens that resolve against the
# `citations` registry below. House rules apply: no em/en dashes, Indian
# English, conservative claims, plain English that lands on first read.
#
# Phase 1 ships two exemplars (lit-7plus, imr). Phase 2 fills the rest.
# -------------------------------------------------------------------------

citations:
  sachar-2006:
    label: "Sachar Committee Report, 2006"
    url: "https://web.archive.org/web/20221013203408id_/https://www.minorityaffairs.gov.in/sites/default/files/sachar_comm.pdf"
  post-sachar-2014:
    label: "Post-Sachar Evaluation Committee, 2014"
    url: "https://www.iosworld.org/ContentPdf/Post_Sachar_Evaluation_Committee.pdf"
  misra-2007:
    label: "Ranganath Misra Commission, 2007"
    url: "https://archive.org/details/PARI.report-of-the-national-commission-for-religious-and-linguistic-minorities"
  nfhs5-2021:
    label: "NFHS-5 India report, 2019-21"
    url: "https://dhsprogram.com/pubs/pdf/FR375/FR375.pdf"
  bhalotra-2010:
    label: "Bhalotra, Valente and van Soest, 2010"
    url: "https://doi.org/10.1016/j.jhealeco.2009.11.002"
  geruso-spears-2018:
    label: "Geruso and Spears, 2018"
    url: "https://doi.org/10.1257/app.20150431"
  ganguly-2022:
    label: "Ganguly, Goli and Rammohan, 2022"
    url: "https://doi.org/10.1186/s41118-022-00177-3"

narratives:

  # ----- Literacy, age 7+ (Census). higher is better. Muslims BEHIND. -----
  lit-7plus:
    bottom_line: >-
      Just under 69% of Muslims aged 7 and above could read and write in 2011,
      the lowest literacy rate among India's larger religious communities and
      about five points behind Hindus. The gap has been narrowing slowly since
      2001, but it stays widest for Muslim women and in rural areas, where
      barely three in five Muslims are literate.
    how_to_read: >-
      The main chart tracks literacy for each community across the 2001 and 2011
      censuses, with Muslims in maroon and the all-India average as the dashed
      line; a rising line means literacy is improving. Because the distance
      between communities is the point, the vertical axis does not start at zero.
      The tabs break the same measure down further: By state shows how far the
      Muslim rate swings across India, By sex exposes the wide gap between Muslim
      men and women, and Urban vs rural shows how much lower literacy runs in
      Muslim villages than in Muslim towns.
    why_it_matters: >-
      Literacy is the floor every other opportunity stands on. It shapes access
      to formal jobs, government services and scholarships, and a household's
      ability to handle paperwork, health information and its own legal rights.
      A community that starts behind on literacy tends to stay behind on income,
      formal work and schooling in the generation that follows.
    status_note: >-
      The gap has closed by roughly a point and a half since 2001, slow but
      steady progress, and it remains widest for Muslim women and in rural areas.
    # Potential drivers: MECE buckets - demand (poverty), supply (access),
    # retention (dropout), gender (female gap), governance (delivery).
    drivers:
      - title: "Poverty"
        text: >-
          Muslims are disproportionately poor and concentrated in informal urban
          work, so children are pulled toward earning rather than staying in
          school {{cite:sachar-2006}}.
      - title: "School access"
        text: >-
          The Sachar Committee found too few schools in many Muslim-majority
          localities, leaving children further from a classroom
          {{cite:sachar-2006}}.
      - title: "Early dropout"
        text: >-
          Muslims had the highest school dropout rate of any large community, most
          leaving around the move from primary to secondary {{cite:sachar-2006}}.
      - title: "The female gap"
        text: >-
          Literacy is lowest of all for Muslim women, so half the community starts
          furthest behind, and a mother's literacy shapes the next generation.
      - title: "Patchy delivery"
        text: >-
          The 2014 Post-Sachar review found remedial schemes existed on paper but
          reached Muslim children unevenly, so gaps persisted through weak delivery
          as much as missing policy {{cite:post-sachar-2014}}.
    levers:
      - title: "Deliver existing aid"
        text: >-
          The Pre-Matric, Post-Matric and Merit-cum-Means scholarships already
          exist; the Post-Sachar priority is consistent delivery, not new schemes
          {{cite:post-sachar-2014}}.
      - title: "Stop early dropout"
        text: >-
          Target the primary-to-secondary transition, where Muslim dropout is
          highest {{cite:sachar-2006}}.
      - title: "Prioritise girls"
        text: >-
          Close the female literacy gap, the widest single sub-gap within the
          community.
      - title: "Back minority schools"
        text: >-
          Protect and strengthen Article 30 minority institutions through the
          National Commission for Minority Educational Institutions.
    stakeholders:
      - name: "Ministry of Minority Affairs"
        url: "https://minorityaffairs.gov.in/"
        mission: >-
          The Union ministry, created in 2006, that runs scholarship and
          development schemes for India's notified minorities, including the
          Pre-Matric, Post-Matric and Merit-cum-Means scholarships.
      - name: "National Commission for Minority Educational Institutions"
        url: "https://ncmei.gov.in/"
        mission: >-
          A statutory body that protects the right of religious and linguistic
          minorities to set up and run their own schools and colleges under
          Article 30 of the Constitution.
      - name: "Zakat Foundation of India"
        url: "https://www.zakatindia.org/Scholarship.html"
        donate_url: "https://www.zakatindia.org/Donate.html"
        credibility:
          label: "80G + FCRA"
          url: "https://www.zakatindia.org/Donate.html"
        mission: >-
          An Indian trust that channels Zakat into competitive-exam coaching,
          scholarships, skill training and orphan care for the Muslim community.
      - name: "Human Welfare Foundation"
        url: "https://www.hwfindia.org/category/education/"
        donate_url: "https://www.hwfindia.org/donate/"
        mission: >-
          A foundation whose Vision 2026 programme builds and supports schools
          and runs scholarships, health and livelihood projects in disadvantaged,
          largely minority areas across India.
      - name: "Association of Muslim Professionals"
        url: "https://www.ampindia.org/AMP_Scholarship_Fund"
        donate_url: "https://www.ampindia.org/make_a_donation"
        mission: >-
          A volunteer professionals' body that runs higher-education scholarships,
          a national talent search and school-development work to widen Muslim
          access to education.
      - name: "Muslim Education Trust, Delhi"
        url: "https://metdelhi.org/scholarships/"
        mission: >-
          A voluntary educational trust that administers Islamic Development Bank
          and its own scholarships for minority students.
      - name: "Markazul Ma'arif"
        url: "https://markazulmaarif.org/education/"
        donate_url: "https://markazulmaarif.org/donation/"
        credibility:
          label: "FCRA registered"
          url: "https://markazulmaarif.org/society-registration-number/"
        mission: >-
          An Assam-based NGO that runs schools for educationally backward
          communities alongside relief, health and skills work, open to all
          irrespective of faith.
      - name: "Aga Khan Education Service, India"
        url: "https://akf.org/country/india/"
        credibility:
          label: "FCRA registered"
          url: "https://akf.org/country/india/"
        mission: >-
          The Aga Khan network's Indian education arm, running schools and
          early-childhood programmes. Founded by the Ismaili community, it serves
          all communities.
      - name: "Pratham"
        url: "https://pratham.org/programs/education/"
        donate_url: "https://pratham.org/donation/"
        credibility:
          label: "GiveIndia vetted"
          url: "https://give.do/discover/17G3/pratham-education-foundation/"
        mission: >-
          One of India's largest education NGOs, raising children's foundational
          reading and arithmetic, and the producer of the annual ASER learning
          survey.

  # ----- Infant Mortality Rate (NFHS). lower is better. Muslims AHEAD. -----
  imr:
    bottom_line: >-
      Muslims have lower infant mortality than Hindus, and have done so in every
      national survey since the 1990s, despite being poorer on most other
      measures. In the latest survey, 2019-21, about 33 Muslim infants died
      before their first birthday for every 1,000 born, against 35 among Hindus.
      This Muslim survival advantage is real but shrinking, as mortality has
      fallen faster among other communities.
    how_to_read: >-
      The main chart tracks infant deaths per 1,000 live births for each
      community across four National Family Health Surveys from 1998 to 2019-21;
      here a falling line is good news, since lower is better. Every community's
      line drops steeply, so the chart shows both the broad decline and the
      narrowing distance between communities. The Urban vs rural tab splits each
      rate into town and village, where most infant deaths still happen, and
      shows the Muslim advantage is largely a rural one.
    why_it_matters: >-
      Infant mortality is one of the most sensitive measures of a population's
      living conditions, capturing the combined effect of nutrition, sanitation,
      maternal health and access to care in the first, most fragile year of life.
      That Muslims do better here than richer communities is one of the most
      studied puzzles in Indian demography, and a reminder that income alone does
      not determine survival.
    status_note: >-
      Muslims have recorded lower infant mortality than Hindus in every survey
      since 1998, but the advantage has shrunk from roughly 18 points then to
      about 2 today as mortality fell faster among other communities.
    # Potential drivers: MECE buckets - external environment (sanitation),
    # maternal-biological (the part the data explains), and the unexplained
    # residual (the genuine puzzle).
    drivers:
      - title: "Sanitation"
        text: >-
          Muslim neighbourhoods practise less open defecation, and this local
          difference alone accounts for a large share of the survival gap, an
          effect that protects Hindu neighbours too {{cite:geruso-spears-2018}}.
      - title: "Maternal health"
        text: >-
          The part researchers can explain comes mainly from mothers' height and
          diet, not the breastfeeding or birth-spacing stories often repeated in
          the press {{cite:bhalotra-2010}}.
      - title: "Still a puzzle"
        text: >-
          After income, education and the usual risk factors are accounted for,
          those predict Muslims should fare worse, not better, so most of the
          advantage stays unexplained {{cite:bhalotra-2010}}.
    levers:
      - title: "Sanitation for all"
        text: >-
          The gain tied most directly to infant survival; it saves lives
          everywhere and erodes the Muslim edge as open defecation falls
          {{cite:geruso-spears-2018}}.
      - title: "Maternal and newborn care"
        text: >-
          The National Health Mission's immunisation, institutional delivery and
          newborn care is the main public instrument.
      - title: "Stick to the basics"
        text: >-
          Because the advantage itself is mostly unexplained, the surest gains
          come from what helps every infant, not from trying to bottle what Muslim
          households are doing right {{cite:bhalotra-2010}}.
    # Note: genuinely Muslim-specific maternal-child-health NGOs in India are
    # scarce; the Aga Khan health network is the one Muslim-founded MCH operation,
    # so the rest of this list is the credible secular MCH field (honest fill).
    stakeholders:
      - name: "Ministry of Health and Family Welfare"
        url: "https://mohfw.gov.in/"
        mission: >-
          The Union ministry responsible for India's health policy and its
          family-planning, maternal-health and child-health programmes.
      - name: "National Health Mission"
        url: "https://nhm.gov.in/index1.php?lang=1&level=1&sublinkid=794&lid=168"
        mission: >-
          The Government of India's flagship health programme, working toward
          affordable, quality care including maternal, newborn and child health
          services across rural and urban India.
      - name: "Aga Khan Health Services, India"
        url: "https://the.akdn/en/where-we-work/south-asia/india/health-india"
        mission: >-
          The Aga Khan network's Indian health arm, running maternal and child
          health services including a maternal and child care centre in Hyderabad
          and rural reproductive, child-health and nutrition work. Founded by the
          Ismaili community, it serves all communities.
      - name: "SEWA Rural"
        url: "https://sewarural.org/hospital-services/"
        donate_url: "https://sewarural.org/donate-now/"
        credibility:
          label: "Credibility Alliance accredited"
          url: "https://sewarural.org/awards-recognitions/"
        mission: >-
          A voluntary organisation in tribal south Gujarat whose Kasturba Hospital
          and community programmes deliver maternal and newborn care, with large
          reported falls in maternal and neonatal deaths in its area.
      - name: "Doctors For You"
        url: "https://doctorsforyou.org/public-health/rural-maternal-health-care-bihar.php"
        donate_url: "https://pages.razorpay.com/pl_I8hBrG9gTuRV40/view"
        credibility:
          label: "GiveIndia vetted"
          url: "https://give.do/ngos/doctors-for-you"
        mission: >-
          A humanitarian health NGO providing rural maternal and child health,
          treatment of severe acute malnutrition and disaster medical care across
          several states.
      - name: "Jhpiego India"
        url: "https://jhpiego.org/where-we-work/india/"
        donate_url: "https://jhpiego.org/ways-to-give/donate/"
        mission: >-
          A Johns Hopkins-affiliated non-profit that strengthens maternal and
          newborn care in India by training frontline health workers and
          supporting government programmes.
      - name: "UNICEF India"
        url: "https://www.unicef.org/india/what-we-do/child-survival"
        donate_url: "https://www.unicef.org/india/take-action/donate-to-unicef"
        mission: >-
          The UN Children's Fund's India office, working with states on child
          survival, immunisation and maternal and newborn health.
      - name: "International Institute for Population Sciences"
        url: "https://www.iipsindia.ac.in/"
        mission: >-
          The Mumbai institute that conducts the National Family Health Survey,
          the source of India's infant-mortality and maternal and child health
          figures by population group.
