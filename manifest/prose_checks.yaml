# CROSS_SURFACE: the same figure string is hardcoded in several files and they
# must not drift apart (the "keep N places in sync" pain). Exact substring in
# every listed file. Use tokens that are written identically everywhere.
cross_surface:
  - label: ger-higher-ed community figures
    strings: ["14.5%", "24.2%", "22.8%"]
    files:
      - manifest/narratives.yaml
      - manifest/metrics.yaml
      - CLAUDE.md
      - docs/runbooks/aishe.md
      - docs/runbooks/cmse-education.md

# INTERNAL_MATH: a derived figure in a build.py literal recomputed from canonical.
internal_math:
  # ls-share parity seats = round(pop_share% / 100 * house). Guards the "77" in
  # the Lok Sabha narrative against a pop-share or house-size change.
  - label: ls-share parity seats
    kind: ls_parity
    expect_in: [manifest/narratives.yaml, manifest/metrics.yaml]
  # school-edu-spend "for every INR 100 a Hindu spends ... about INR <r>" where
  # r = round(muslim/hindu*100). Guards the build.py ratio literal.
  - label: school-edu-spend INR-100 ratio
    kind: ratio_of_latest
    metric: school-edu-spend
    expect_in: [dashboard/build.py]
