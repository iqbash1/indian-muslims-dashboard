# Prose-number registry for validate/audit_prose_numbers.py
#
# Hardcoded numbers in authored prose (narratives.yaml, metrics.yaml, build.py
# literals, runbooks, CLAUDE.md) can silently drift from the canonical CSV
# values the charts/heroes/pills/tables actually render. The render path is
# safe (computed every build); prose is not. This registry says, for each
# figure the prose quotes, WHICH canonical cell it must track, so the guard can
# recompute the value and confirm the prose still matches.
#
# Seeded by the 2026-06-28 consistency audit (see the audit findings). Add an
# entry whenever you hardcode a canonical figure into prose; the guard then
# fails CI if that figure later drifts from canonical.
#
# Tolerances are unit-aware (a percent quoted as "about 69%" must accept the
# 68.6 canonical value). INR/lakh and counts are matched as the Indian-money /
# grouped string the dashboard renders; percents/rates/ratios match any number
# within `tol` of the canonical value.

defaults:
  tol_percent: 0.6          # pp: covers whole-number rounding of a .x value
  tol_rate: 0.6
  tol_ratio: 1.5            # females_per_1000_males
  tol_count: 0.5            # effectively exact integer

# ANCHORED: a canonical cell (metric + religion [+ sex/residence], latest year)
# whose value must appear in the named authored prose field. field is one of the
# narratives.yaml keys (bottom_line/how_to_read/why_it_matters/status_note).
