      auth_required: false
    formats: [pdf]
    religion_disaggregated: varies
    geography_levels: [national, state]
    coverage:
      - communal_incidents_reported
      - hate_crime_data_government_acknowledged
    known_issues:
      - "Data only appears when questions are asked and answered; coverage uneven"
    archive_dir: sources/mha-parliament/
    runbook: docs/runbooks/mha-parliament.md
    last_pulled: null
    next_expected: null
    targets: []

  - id: civic-incident-databases
    name: Civic-tech incident databases (Documentation of the Oppressed, India Hate Lab, Hindutva Watch)
