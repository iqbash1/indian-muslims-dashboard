  - id: census-india-2001
    name: Census of India 2001
    publisher: Office of the Registrar General & Census Commissioner, MoHA
    home_url: https://censusindia.gov.in/
    cadence: 10-year
    cadence_notes: |
      Prior decennial round to Census 2011. Pulled for decennial (2001 -> 2011)
      religion differentials on sex-ratio and literacy. Religion tables live in
      the NADA catalog under idno prefix PC01_* (same table codes as 2011:
      C-01 population, C-09 education-by-religion).
    access:
      method: web-download
      auth_required: false
    formats: [xls]
    religion_disaggregated: true
    geography_levels: [national, state]
    coverage:
      - population
      - sex_ratio
      - literacy
      - educational_attainment
    known_issues:
      - "Legacy .xls (BIFF) workbook — read with xlrd, not openpyxl (same as 2011 C-1)"
      - "censusindia.gov.in NADA serves a cert chain Python's bundled CAs reject; pull.py uses truststore"
      - "Decennial 2001 -> 2011 comparison uses identical Census literacy (7+) and all-ages sex-ratio definitions — same series, no methodology break"
    archive_dir: sources/census-2001/
    runbook: docs/runbooks/census-india-2001.md
    last_pulled: null
    next_expected: null
    targets:
      - target_id: c01-population-by-religion
        description: C-1 Population by Religious Community, India 2001 (national + states; persons/males/females → sex ratio + population share)
        url: https://censusindia.gov.in/nada/index.php/catalog/21462/download/24594/PC01_C01_00.xls
        target_path: sources/census-2001/c-series/c01-population-by-religion.xls
        status: verified
      - target_id: c09-education-by-religion
        description: C-9 Educational Level by Religious Community and Sex for population age 7+, India 2001 (national + states → literacy rate)
        url: https://censusindia.gov.in/nada/index.php/catalog/22250/download/25381/PC01_C09_00.xls
        target_path: sources/census-2001/c-series/c09-education-by-religion.xls
        status: verified

  - id: census-india-1991
    name: Census of India 1991
    publisher: Office of the Registrar General & Census Commissioner, MoHA
    home_url: https://censusindia.gov.in/
    cadence: 10-year
    cadence_notes: |
      Decennial Census 1991. Used as PRIMARY source for sex-ratio by religion
      at the national level, extending the 2001-2011 trend back to 1991. The
      RGI published the all-India religion-by-residence-by-sex breakdown as
      table C-9 (1991-numbering). NADA catalog 35737 hosts the machine-
      readable XLSX. NADA catalog 32995 hosts the companion PDF
      "Religion, Paper 1 of 1995, Series-1, India" with the same C-9 table
      printed plus introductory note.
    access:
      method: web-download
      auth_required: false
    formats: [xlsx, pdf]
    religion_disaggregated: true
    geography_levels: [national, state, district]
    coverage:
      - population
      - sex_ratio
    known_issues:
      - "1991 Census not held in Jammu & Kashmir — all-India figures exclude J&K"
      - "1991 'C-9' is the RELIGION table (population x sex x residence x religion). 2011 numbering uses C-9 for EDUCATION-by-religion — different tables, do not confuse."
      - "Educational level / literacy by religion was NOT published as a separate XLSX on NADA for 1991; only population dimensions are machine-readable for this round"
    archive_dir: sources/census-1991/
    runbook: docs/runbooks/census-india-1991.md
    last_pulled: null
    next_expected: null
    targets:
      - target_id: c09-religion-population
        description: C-9 Religion (XLSX) — population by religious community x residence x sex for India, states, districts
        url: https://censusindia.gov.in/nada/index.php/catalog/35737/download/39400/1991-C09T-0100.xlsx
        target_path: sources/census-1991/c09-religion.xlsx
        status: verified
      - target_id: religion-paper-1-of-1995
        description: Religion, Paper 1 of 1995, Series-1, India — RGI's 1991 religion publication (companion PDF to the C-9 XLSX, with introductory note + 1981→1991 comparison tables)
        url: https://censusindia.gov.in/nada/index.php/catalog/32995/download/36813/48848_1991_REL.pdf
        target_path: sources/census-1991/religion-paper-1-of-1995.pdf
        status: verified

  - id: census-india-1971
    name: Census of India 1971
    publisher: Office of the Registrar General & Census Commissioner, MoHA
    home_url: https://censusindia.gov.in/
    cadence: 10-year
    cadence_notes: |
      Decennial Census 1971. Used as PRIMARY source for sex-ratio by religion
      at the national level. The RGI publication "Paper 2 of 1972: Religion"
      (Series-1, India, by A. Chandra Sekhar RGI) summarises the all-India
      religion-by-sex breakdown for all six major communities in its
      Introductory Note (p.xiii of the printed paper / p17 of the NADA PDF).
      No separate XLSX for 1971 religion exists on NADA — only this PDF.
    access:
      method: web-download
      auth_required: false
    formats: [pdf]
    religion_disaggregated: true
    geography_levels: [national, state]
    coverage:
      - population
      - sex_ratio
    known_issues:
      - "1971 RGI religion paper is PDF-only (no machine-readable XLSX on NADA); extraction reads the printed Summary table in the Introductory Note"
      - "Literacy by religion was NOT published in this 1971 religion paper — sex ratio + population only"
      - "PDF OCR quality is acceptable for the Summary table on p17 but state/district detail tables are messier"
    archive_dir: sources/census-1971/
    runbook: docs/runbooks/census-india-1971.md
    last_pulled: null
    next_expected: null
    targets:
      - target_id: religion-paper-2-of-1972
        description: Paper 2 of 1972, Religion, Series-1, India — Summary of major religious communities with Persons / Males / Females / Sex Ratio at all-India level
        url: https://censusindia.gov.in/nada/index.php/catalog/31626/download/34807/24477_1971_REI.pdf
        target_path: sources/census-1971/religion-paper-2-of-1972.pdf
        status: verified

  - id: census-decadal-religion
    name: Census of India — decadal religion proportions (secondary compilation)
    publisher: Office of the Registrar General & Census Commissioner, MoHA (secondary compilation)
    home_url: https://censusindia.gov.in/
    cadence: 10-year
    cadence_notes: |
      SECONDARY, manually-entered series: % share of each religious community in
      India's population for the two decadal years (1961, 1981) where the
      RGI Religion volume isn't on NADA. Values are the standard Census decadal
      proportions (reproduced identically by RGI summaries, Pew 2021, and
      en.wikipedia.org/wiki/Religion_in_India), cross-validated against this
      repo's PRIMARY C-01 extracts: the 2001 and 2011 shares agree to <0.02pp.
      Handled like the existing ls-share / mla-share manual-entry metrics —
      cited, and flagged "secondary" on the dashboard card.

      Post-Commit-AI: 1971 + 1991 + 2001 + 2011 all flow from PRIMARY RGI
      publications (census-india-1971 / -1991 / -2001 / -2011). This entry's
      scope is now just 1961 + 1981.
    access:
      method: web-search
      auth_required: false
    formats: [manual-entry]
    religion_disaggregated: true
    geography_levels: [national]
    coverage:
      - population_share_by_religion_decadal
    known_issues:
      - "1951 omitted — post-Partition coverage gaps + unreliable small-community figures"
      - "1981 excluded Assam; 1991 excluded Jammu & Kashmir (RGI national figures are interpolated for those rounds)"
      - "Single secondary source for 1961-1991; replace with a pullable primary/RGI table if one surfaces"
    archive_dir: sources/census-decadal-religion/
    runbook: docs/runbooks/census-decadal-religion.md
    last_pulled: null
    next_expected: null
    targets: []

  - id: sachar-committee-2006
    name: Prime Minister's High Level Committee Report on the Social, Economic and Educational Status of the Muslim Community of India (Sachar Committee Report)
    publisher: Cabinet Secretariat, Government of India (Justice Rajinder Sachar, Chair)
    home_url: https://minorityaffairs.gov.in/reports/sachar-committee-report
    cadence: one-off
    cadence_notes: |
      One-off 2006 government report. Used as a SECONDARY compilation of
      decadal Census of India series that the RGI itself only published in
      paper form per-decade (not consolidated by RGI into a single machine-
      readable historical table). Appendix Table 3.8 (p301) gives the
      Muslim + All-India sex-ratio 1961-2001 — the only clean decadal
      compilation we can find for that series. Sachar's underlying source
      citation: India, Registrar General (1961, 1972, 1984, 1994, 2004).
      Cross-validated at 2001: Sachar's "All 933, Muslim 936" matches our
      primary census-india-2001 derivation (all 932.9, muslim 936.1) to
      <0.1pp.
    access:
      method: web-download
      auth_required: false
    formats: [pdf]
    religion_disaggregated: true
    geography_levels: [national, state]
    coverage:
      - sex_ratio_decadal_1961_2001
      - population_share_decadal_1961_2001
      - urbanisation_decadal_1961_2001
